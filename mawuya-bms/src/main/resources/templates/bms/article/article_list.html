<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<style>
    /* 「写博客」按钮：在 Bootstrap btn-primary 基础上做渐变 + 阴影，与 BMS 整体蓝色基调协调 */
    .btn-write-blog {
        background: linear-gradient(135deg, #4facfe 0%, #00b8d4 100%);
        border: none;
        color: #fff;
        padding: 6px 16px;
        font-weight: 500;
        box-shadow: 0 2px 6px rgba(0, 184, 212, .25);
        transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .btn-write-blog:hover,
    .btn-write-blog:focus {
        background: linear-gradient(135deg, #4facfe 0%, #00b8d4 100%);
        color: #fff;
        filter: brightness(1.06);
        box-shadow: 0 4px 12px rgba(0, 184, 212, .35);
        transform: translateY(-1px);
    }
    .btn-write-blog:active {
        transform: translateY(0);
        filter: brightness(.96);
        box-shadow: 0 1px 3px rgba(0, 184, 212, .25);
    }
    .btn-write-blog .fa { margin-right: 4px; }

    /* —— 状态筛选 tab —— */
    .article-status-tabs {
        margin: 0 0 12px 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        border-bottom: 1px solid #e5e9ef;
    }
    .article-status-tabs li {
        position: relative;
    }
    .article-status-tabs a {
        display: inline-block;
        padding: 8px 16px;
        color: #5a6c80;
        text-decoration: none;
        border-radius: 4px 4px 0 0;
        font-size: 13px;
        transition: background .15s ease, color .15s ease;
    }
    .article-status-tabs a:hover {
        background: #f5f7fa;
        color: #2494f2;
    }
    .article-status-tabs li.active a {
        color: #2494f2;
        background: #fff;
        border: 1px solid #e5e9ef;
        border-bottom: 1px solid #fff;
        margin-bottom: -1px;
        font-weight: 500;
    }
    .article-status-tabs .tab-count {
        display: inline-block;
        margin-left: 4px;
        min-width: 18px;
        padding: 0 5px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        font-size: 11px;
        color: #fff;
        background: #b8c4d3;
        border-radius: 9px;
    }
    .article-status-tabs li.active .tab-count {
        background: #2494f2;
    }

    /* —— 状态徽章 —— */
    .article-status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        white-space: nowrap;
    }
    .article-status-badge.status-0 {
        color: #8c7900;
        background: #fff8d6;
        border: 1px solid #ffe66e;
    }
    .article-status-badge.status-1 {
        color: #1d8b3a;
        background: #e6f7ea;
        border: 1px solid #a3deb1;
    }
    .article-status-badge.status-2 {
        color: #a13d3d;
        background: #fbeaea;
        border: 1px solid #e9b4b4;
    }

    /* —— 文章列表的标签徽章 —— */
    .article-tag-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        margin: 2px 4px 2px 0;
        border-radius: 10px;
        border: 1px solid currentColor;
        background: rgba(255,255,255,.5);
        font-size: 12px;
        line-height: 1.6;
        white-space: nowrap;
    }
    .article-tag-pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
    }
</style>

<div class="page-head">
    <ol class="breadcrumb">
        <li>博客管理</li>
        <li class="active">博客列表</li>
        <span style="float:right;">
            <button type="button" title="撰写并发布一篇新博客" onclick="toAddBlogPage()"
                    class="btn btn-primary btn-sm btn-write-blog">
                <i class="fa fa-pencil-square-o"></i> 写博客
            </button>
            <button type="button" title="刷新列表" onclick="refreshArticleList()"
                    class="btn btn-default btn-sm" style="margin-left:6px;">
                <i class="fa fa-refresh"></i> 刷新
            </button>
        </span>
    </ol>
</div>
<div class="row">
    <div class="col-md-12">
        <div class="block-flat">
            <div class="content">
                <!--
                    状态筛选 tab：通过 ?status=all/0/1/2 重新加载本页。
                    各 tab 的计数通过 Thymeleaf 在服务端直接遍历 articleList 之外
                    再做一次"全量+分状态"统计成本较高；这里改为在前端 JS 里基于
                    当前已渲染列表的全量 ajax 重新拉取并填充，简洁可靠。
                -->
                <ul class="article-status-tabs" id="article-status-tabs">
                    <li th:classappend="${currentStatus == 'all'} ? 'active'">
                        <a href="javascript:void(0)" data-status="all">
                            全部<span class="tab-count" data-count="all">0</span>
                        </a>
                    </li>
                    <li th:classappend="${currentStatus == '1'} ? 'active'">
                        <a href="javascript:void(0)" data-status="1">
                            已发布<span class="tab-count" data-count="1">0</span>
                        </a>
                    </li>
                    <li th:classappend="${currentStatus == '0'} ? 'active'">
                        <a href="javascript:void(0)" data-status="0">
                            草稿<span class="tab-count" data-count="0">0</span>
                        </a>
                    </li>
                    <li th:classappend="${currentStatus == '2'} ? 'active'">
                        <a href="javascript:void(0)" data-status="2">
                            已撤回<span class="tab-count" data-count="2">0</span>
                        </a>
                    </li>
                </ul>

                <div class="table-responsive">
                    <table class="table table-bordered" id="datatable-article">
                        <thead>
                        <tr>
                            <th>序号</th>
                            <th>博客标题</th>
                            <th>状态</th>
                            <th>博客分类</th>
                            <th>标签</th>
                            <th>阅读次数</th>
                            <th>评论次数</th>
                            <th>背景图片</th>
                            <th>发布时间</th>
                            <th>修改时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr class="odd gradeX" th:each="item, status : ${articleList}">
                            <td th:text="${status.count}"></td>
                            <td th:text="${item.articleTitle}"></td>
                            <td>
                                <!-- 状态徽章：0=草稿 / 1=已发布 / 2=已撤回 -->
                                <span th:if="${item.status == 0}"
                                      class="article-status-badge status-0">草稿</span>
                                <span th:if="${item.status == 1 or item.status == null}"
                                      class="article-status-badge status-1">已发布</span>
                                <span th:if="${item.status == 2}"
                                      class="article-status-badge status-2">已撤回</span>
                            </td>
                            <td>
                                <span th:if="${item.categorySn == 0}">暂无分类</span>
                                <th:block th:if="${item.categorySn != 0}">
                                    <th:block th:each="c : ${categoryList}">
                                        <span th:if="${c.sn == item.categorySn}" th:text="${c.categoryName}"></span>
                                    </th:block>
                                </th:block>
                            </td>
                            <!-- 标签徽章：与 AMS 右侧栏标签云数据来源一致（tag_info + article_tag） -->
                            <td style="max-width:240px;">
                                <th:block th:with="ts=${articleTagMap != null ? articleTagMap.get(item.sn) : null}">
                                    <span th:if="${ts == null or ts.isEmpty()}" style="color:#bbb;">—</span>
                                    <span th:each="t : ${ts}"
                                          class="article-tag-pill"
                                          th:style="|color:${t.tagColor != null ? t.tagColor : '#2494f2'};|">
                                        <span class="dot" aria-hidden="true"></span>
                                        <span th:text="${t.tagName}">tag</span>
                                    </span>
                                </th:block>
                            </td>
                            <td th:text="${item.readNum}"></td>
                            <td th:text="${item.reviewNum}"></td>
                            <td>
                                <img th:if="${item.pictureUrl != null and !#strings.isEmpty(item.pictureUrl)}"
                                     th:with="firstImg=${#strings.contains(item.pictureUrl, ';') ? #strings.substringBefore(item.pictureUrl, ';') : item.pictureUrl}"
                                     th:src="${firstImg}" alt="背景图"
                                     class="bms-thumb"
                                     style="width:64px;height:40px;object-fit:cover;border-radius:3px;cursor:pointer;"
                                     th:attr="onclick=|previewImg('${firstImg}')|"/>
                                <span th:if="${item.pictureUrl == null or #strings.isEmpty(item.pictureUrl)}"
                                      style="color:#bbb;">—</span>
                            </td>
                            <td>
                                <!-- 草稿尚未发布时 insert_time 为空，避免显示"null" -->
                                <span th:if="${item.insertTime != null}" th:text="${item.insertTime}"></span>
                                <span th:if="${item.insertTime == null}" style="color:#bbb;">—</span>
                            </td>
                            <td th:text="${item.updateTime}"></td>
                            <td class="center" style="white-space:nowrap;">
                                <i class="fa fa-cloud-upload" title="上传背景图"
                                   th:attr="onclick=|uploadPicture('${item.sn}')|"></i>&nbsp;&nbsp;
                                <i class="fa fa-pencil"
                                   th:title="${item.status == 0} ? '继续编辑草稿' : '修改'"
                                   th:attr="onclick=|toModBlogPage('${item.sn}')|"></i>&nbsp;&nbsp;
                                <!-- 撤回：仅已发布可见 -->
                                <i th:if="${item.status == 1 or item.status == null}"
                                   class="fa fa-undo" title="撤回到可编辑状态"
                                   style="color:#a13d3d;"
                                   th:attr="onclick=|withdrawBlog('${item.sn}')|"></i>
                                <!-- 重新发布：仅已撤回可见 -->
                                <i th:if="${item.status == 2}"
                                   class="fa fa-share-square-o" title="重新发布"
                                   style="color:#1d8b3a;"
                                   th:attr="onclick=|republishBlog('${item.sn}')|"></i>
                                <!-- 发布草稿：仅草稿可见 -->
                                <i th:if="${item.status == 0}"
                                   class="fa fa-paper-plane" title="发布草稿"
                                   style="color:#1d8b3a;"
                                   th:attr="onclick=|publishDraft('${item.sn}')|"></i>&nbsp;&nbsp;
                                <i class="fa fa-trash-o" title="删除"
                                   th:attr="onclick=|delBlog('${item.sn}')|"></i>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var __ctx = /*[[@{/}]]*/ '/';
    var __currentStatus = /*[[${currentStatus}]]*/ 'all';
    function _u(p) { return __ctx.replace(/\/$/, '') + p; }
    /*]]>*/

    /**
     * 找到当前博客列表所在的 BMS tab-pane 容器。
     *
     * <p>背景：之前硬编码 {@code #content3} 是错的（早期菜单 id=3，d72514f 一键换皮
     * commit 把"博客列表"的 link-li id 改成 4，但本文件 #content3 没同步改），
     * 导致点击"写博客 / 修改 / 删除 / 上传背景图 / 刷新"等任意按钮，
     * jQuery 集合为空 → silent 无反应，正是用户主诉的 bug。</p>
     *
     * <p>修复：改用就近 DOM 查找 {@code .closest('.tab-pane')}，与 left.html 菜单
     * id 完全解耦；未来再调整菜单顺序也不会再出现该类 ghost-click 问题。</p>
     */
    function findCurrentTab() {
        var $tab = $('#datatable-article').closest('.tab-pane');
        return $tab.length ? $tab : null;
    }

    /** 在当前 tab 容器内 load 指定 URL；找不到 tab 时兜底走整页刷新，避免 silent 失败。 */
    function reloadCurrentTab(url) {
        var $tab = findCurrentTab();
        if ($tab) {
            $tab.load(url);
        } else {
            window.location.reload();
        }
    }

    /** 构造列表 URL，附带 status 过滤参数（用于 tab 切换与各种操作后的 reload） */
    function listUrlWithStatus(st) {
        var base = _u('/bms/article/list.do');
        if (!st || st === 'all') return base;
        return base + '?status=' + encodeURIComponent(st);
    }

    $(function () {
        $('#datatable-article').dataTable();

        // tab 点击切换：直接重载当前 tab 容器内容
        $('#article-status-tabs').on('click', 'a[data-status]', function () {
            var st = $(this).attr('data-status');
            reloadCurrentTab(listUrlWithStatus(st));
        });

        // 异步取分状态计数（避免 backend 每次列表请求都跑 4 次 count）
        loadStatusCounts();
    });

    /**
     * 拉一次"全部"列表用于本地分类计数。
     *
     * <p>这里复用现有的 list.do 接口（HTML 渲染），通过解析返回 DOM 中的状态徽章数量来计数。
     * 之所以不新增 JSON 端点：实现成本最低、零额外维护；BMS 列表不在性能敏感路径。
     * 若未来列表数据量超 1k，可改为新增 {@code /bms/api/article/statusCounts} 端点。</p>
     */
    function loadStatusCounts() {
        $.ajax({
            type: 'get',
            url: _u('/bms/article/list.do'),
            dataType: 'html',
            success: function (html) {
                var counts = {all: 0, '0': 0, '1': 0, '2': 0};
                var $rows = $(html).find('#datatable-article tbody tr');
                counts.all = $rows.length;
                $rows.each(function () {
                    if ($(this).find('.status-0').length) counts['0']++;
                    else if ($(this).find('.status-2').length) counts['2']++;
                    else counts['1']++; // 未带徽章的旧数据按已发布算
                });
                Object.keys(counts).forEach(function (k) {
                    $('#article-status-tabs .tab-count[data-count="' + k + '"]').text(counts[k]);
                });
            }
        });
    }

    function toModBlogPage(sn) {
        reloadCurrentTab(_u('/bms/article/toUpdate.do?sn=') + sn);
    }

    function toAddBlogPage() {
        reloadCurrentTab(_u('/bms/article/toAdd.do?'));
    }

    /** 刷新当前博客列表（保留当前状态筛选） */
    function refreshArticleList() {
        var $tab = findCurrentTab();
        if (!$tab) {
            window.location.reload();
            return;
        }
        var load = layer.load(0, {shade: [0.1, '#fff']});
        $tab.load(listUrlWithStatus(__currentStatus), function () {
            layer.close(load);
            layer.msg('已刷新', {icon: 1, time: 800});
        });
    }

    function uploadPicture(sn) {
        var html = ''
            + '<form enctype="multipart/form-data" method="post" id="backgroundImgUploadForm" '
            + '      style="padding:14px 16px 6px; box-sizing:border-box;">'
            + '  <input name="sn" type="hidden" value="' + sn + '" />'
            // —— 顶部：选择来源（本地上传 / 图片库选择）——
            + '  <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">'
            + '    <button type="button" class="btn btn-default btn-sm" id="bg-pick-from-lib-' + sn + '">'
            + '      <i class="fa fa-picture-o"></i> 从图片库选择'
            + '    </button>'
            + '    <span style="line-height:30px; font-size:12px; color:#888;">'
            + '      或在下方上传新图片'
            + '    </span>'
            + '  </div>'
            + '  <div class="img-upload-zone">'
            + '    <label for="bgImgInput-' + sn + '" class="img-upload-trigger">'
            + '      <i class="fa fa-cloud-upload"></i>'
            + '      <span class="hint">点击或将图片拖到此处</span>'
            + '      <span class="meta">支持 jpg/png/gif/webp，≤10MB</span>'
            + '    </label>'
            + '    <input type="file" id="bgImgInput-' + sn + '" name="backgroundImg" '
            + '           accept="image/*" style="display:none" />'
            + '    <div class="img-preview-wrap" style="display:none;">'
            + '      <img class="img-preview" alt="预览" />'
            + '      <div class="img-preview-meta"></div>'
            + '      <button type="button" class="btn btn-default btn-xs img-preview-clear">'
            + '        <i class="fa fa-times"></i> 清除'
            + '      </button>'
            + '    </div>'
            + '  </div>'
            + '</form>';

        layer.open({
            type: 1,
            skin: 'layui-layer-lan',
            title: '设置背景图片',
            content: html,
            area: ['480px', 'auto'],
            btn: ['确定上传', '取消'],
            success: function () {
                bindBgImgPreview(sn);
                bindBgImgPickFromLibrary(sn);
            },
            yes: function (index) {
                var form = $('#backgroundImgUploadForm');
                var fileInput = form.find('input[type=file]')[0];
                if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                    layer.msg('请先选择一张图片，或点击"从图片库选择"', {icon: 7});
                    return;
                }
                var load = layer.load(0, {shade: [0.1, '#fff']});
                $.ajax({
                    type: "post",
                    url: _u("/bms/api/article/cover/upload"),
                    cache: false,
                    data: new FormData(form[0]),
                    processData: false,
                    contentType: false,
                    dataType: 'json',
                        success: function (res) {
                        layer.close(load);
                        layer.close(index);
                        if (Api.isOk(res)) {
                            layer.alert(Api.msg(res, '上传背景图片成功！'), {
                                skin: 'layui-layer-lan',
                                icon: 1,
                                end: function () {
                                    reloadCurrentTab(listUrlWithStatus(__currentStatus));
                                }
                            });
                        } else {
                            layer.alert(Api.msg(res, '上传背景图片失败！'),
                                        {skin: 'layui-layer-lan', closeBtn: 0, icon: 2});
                        }
                    },
                    error: function () {
                        layer.close(load);
                        layer.alert('上传出错（网络/格式/大小？）', {icon: 2});
                    }
                });
            }
        });
    }

    /**
     * 给"从图片库选择"按钮绑定行为：
     * 1) 打开 picker iframe（layer type=2）
     * 2) picker 选中 → 注册 window.__onImagePicked → 调 setBackgroundFromLibrary.do
     * 3) 成功后关闭 picker 与外层上传弹窗，刷新文章列表
     */
    function bindBgImgPickFromLibrary(sn) {
        var $btn = $('#bg-pick-from-lib-' + sn);
        $btn.off('click.libpick').on('click.libpick', function () {
            var iw = Math.min(window.innerWidth - 40, 1100);
            var ih = Math.min(window.innerHeight - 40, 720);
            var isMobile = window.innerWidth <= 600;
            var areaW = isMobile ? '100%' : iw + 'px';
            var areaH = isMobile ? '100%' : ih + 'px';

            var pickerLayer = layer.open({
                type: 2,
                title: '从图片库选择背景图',
                skin: 'layui-layer-lan',
                shadeClose: false,
                maxmin: !isMobile,
                area: [areaW, areaH],
                content: _u('/bms/image/picker.do')
            });

            // picker iframe 内会调 parent.__onImagePicked / __onImagePickerCancel / __onImagePickerGotoLibrary
            window.__onImagePicked = function (item) {
                if (!item || !item.sn) {
                    layer.msg('选择失败', {icon: 2});
                    return;
                }
                var load = layer.load(0, {shade: [0.1, '#fff']});
                $.ajax({
                    type: 'post',
                    url: _u('/bms/api/article/cover/from-library'),
                    data: {sn: sn, imageSn: item.sn},
                    cache: false,
                    dataType: 'json',
                    success: function (res) {
                        layer.close(load);
                        if (Api.isOk(res)) {
                            layer.close(pickerLayer);
                            // 关掉外层"设置背景图片"弹窗（找当前最外层 layer）
                            layer.closeAll('page');
                            layer.msg(Api.msg(res, '背景图设置成功'), {icon: 1, time: 1000});
                            reloadCurrentTab(listUrlWithStatus(__currentStatus));
                        } else {
                            layer.alert(Api.msg(res, '设置背景图失败'),
                                        {skin: 'layui-layer-lan', icon: 2});
                        }
                    },
                    error: function () {
                        layer.close(load);
                        layer.alert('网络异常，设置失败', {icon: 2});
                    }
                });
            };
            window.__onImagePickerCancel = function () {
                layer.close(pickerLayer);
            };
            window.__onImagePickerGotoLibrary = function () {
                layer.close(pickerLayer);
                layer.closeAll('page');
                // 跨 tab 跳转：复用 left.html 的菜单点击，由 BMS 主框架统一处理 tab 创建/激活，
                // 比硬编码 #contentN 更稳（菜单 id 调整时不需要联动改）。
                var $libLink = $('.link-li').filter(function () {
                    return ($(this).attr('link-url') || '').indexOf('/bms/image/library.do') >= 0;
                });
                if ($libLink.length) {
                    $libLink.trigger('click');
                } else {
                    // 兜底：未找到图片库菜单（权限被裁剪等场景），就近在当前 tab load
                    reloadCurrentTab(_u('/bms/image/library.do'));
                }
            };
        });
    }

    /** 给上传 form 注册：选择文件即时预览 + 拖拽支持 + 清除按钮 */
    function bindBgImgPreview(sn) {
        var $form = $('#backgroundImgUploadForm');
        var $zone = $form.find('.img-upload-zone');
        var $trigger = $form.find('.img-upload-trigger');
        var $input = $form.find('input[type=file]');
        var $previewWrap = $form.find('.img-preview-wrap');
        var $img = $form.find('.img-preview');
        var $meta = $form.find('.img-preview-meta');

        function show(file) {
            if (!file) return;
            if (!/^image\//.test(file.type)) {
                layer.msg('请选择图片文件', {icon: 7});
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                layer.msg('图片不能超过 10MB', {icon: 7});
                return;
            }
            var reader = new FileReader();
            reader.onload = function (e) {
                $img.attr('src', e.target.result);
                $meta.text(file.name + ' · ' + (file.size / 1024).toFixed(1) + ' KB');
                $previewWrap.show();
                $trigger.hide();
            };
            reader.readAsDataURL(file);
        }

        $input.off('change').on('change', function () {
            if (this.files && this.files[0]) show(this.files[0]);
        });

        // 拖拽支持
        $zone.off('dragover dragleave drop')
            .on('dragover', function (e) { e.preventDefault(); $(this).addClass('drag-over'); })
            .on('dragleave', function (e) { e.preventDefault(); $(this).removeClass('drag-over'); })
            .on('drop', function (e) {
                e.preventDefault();
                $(this).removeClass('drag-over');
                var dt = e.originalEvent.dataTransfer;
                if (dt && dt.files && dt.files[0]) {
                    // 把拖入的文件赋给 input（用 DataTransfer API 兼容）
                    try {
                        var dt2 = new DataTransfer();
                        dt2.items.add(dt.files[0]);
                        $input[0].files = dt2.files;
                    } catch (err) { /* 老浏览器降级：直接预览 */ }
                    show(dt.files[0]);
                }
            });

        // 清除
        $form.find('.img-preview-clear').off('click').on('click', function () {
            $input.val('');
            $img.attr('src', '');
            $previewWrap.hide();
            $trigger.show();
        });
    }

    function previewImg(url) {
        if (!url) return;
        layer.open({
            type: 1,
            title: '图片预览',
            skin: 'layui-layer-lan',
            area: ['auto', 'auto'],
            content: '<div style="padding:12px;text-align:center;">' +
                     '  <img src="' + url + '" style="max-width:80vw;max-height:75vh;display:block;margin:0 auto;border-radius:4px;" />' +
                     '</div>'
        });
    }

    function delBlog(sn) {
        layer.confirm('确认删除？', {btn: ['是', '我后悔了'], skin: 'layui-layer-lan'}, function () {
            var load = layer.load(0, {shade: [0.1, '#fff']});
            $.ajax({
                type: "post",
                url: _u('/bms/api/article/delete'),
                data: {sn: sn},
                cache: false,
                dataType: 'json',
                success: function (res) {
                        layer.close(load);
                    if (Api.isOk(res)) {
                        layer.alert(Api.msg(res, '删除成功'), {
                            skin: 'layui-layer-lan',
                            icon: 1,
                            end: function () {
                                reloadCurrentTab(listUrlWithStatus(__currentStatus));
                            }
                        });
                    } else {
                        layer.alert(Api.msg(res, '删除失败'),
                                    {skin: 'layui-layer-lan', closeBtn: 0, icon: 2});
                    }
                }
            });
        });
    }

    /** 撤回博客：让用户填写撤回原因（可空），状态由已发布 → 已撤回 */
    function withdrawBlog(sn) {
        layer.prompt({
            formType: 2,
            title: '撤回原因（可选，便于事后回溯）',
            skin: 'layui-layer-lan',
            maxlength: 200,
            value: ''
        }, function (remark, index) {
            var load = layer.load(0, {shade: [0.1, '#fff']});
            $.ajax({
                type: 'post',
                url: _u('/bms/api/article/withdraw'),
                data: {sn: sn, remark: remark || ''},
                cache: false,
                dataType: 'json',
                success: function (res) {
                    layer.close(load);
                    layer.close(index);
                    if (Api.isOk(res)) {
                        layer.msg(Api.msg(res, '已撤回'), {icon: 1, time: 1200});
                        reloadCurrentTab(listUrlWithStatus(__currentStatus));
                    } else {
                        layer.alert(Api.msg(res, '撤回失败'),
                                    {skin: 'layui-layer-lan', icon: 2});
                    }
                },
                error: function () {
                    layer.close(load);
                    layer.alert('网络异常，撤回失败', {icon: 2});
                }
            });
        });
    }

    /** 重新发布：已撤回 → 已发布 */
    function republishBlog(sn) {
        layer.confirm('确认重新发布这篇博客？发布后将对外可见。',
            {btn: ['确认重新发布', '取消'], skin: 'layui-layer-lan'},
            function (index) {
                var load = layer.load(0, {shade: [0.1, '#fff']});
                $.ajax({
                    type: 'post',
                    url: _u('/bms/api/article/republish'),
                    data: {sn: sn},
                    cache: false,
                    dataType: 'json',
                    success: function (res) {
                        layer.close(load);
                        layer.close(index);
                        if (Api.isOk(res)) {
                            layer.msg(Api.msg(res, '已重新发布'), {icon: 1, time: 1200});
                            reloadCurrentTab(listUrlWithStatus(__currentStatus));
                        } else {
                            layer.alert(Api.msg(res, '重新发布失败'),
                                        {skin: 'layui-layer-lan', icon: 2});
                        }
                    }
                });
            }
        );
    }

    /** 发布草稿：草稿 → 已发布 */
    function publishDraft(sn) {
        layer.confirm('确认发布这篇草稿？',
            {btn: ['确认发布', '取消'], skin: 'layui-layer-lan'},
            function (index) {
                var load = layer.load(0, {shade: [0.1, '#fff']});
                $.ajax({
                    type: 'post',
                    url: _u('/bms/api/article/publish'),
                    data: {sn: sn},
                    cache: false,
                    dataType: 'json',
                    success: function (res) {
                        layer.close(load);
                        layer.close(index);
                        if (Api.isOk(res)) {
                            layer.msg(Api.msg(res, '已发布'), {icon: 1, time: 1200});
                            reloadCurrentTab(listUrlWithStatus(__currentStatus));
                        } else {
                            layer.alert(Api.msg(res, '发布失败'),
                                        {skin: 'layui-layer-lan', icon: 2});
                        }
                    }
                });
            }
        );
    }
</script>
