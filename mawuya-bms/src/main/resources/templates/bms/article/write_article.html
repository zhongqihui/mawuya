<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #ffffff !important;">
<head>
    <meta charset="utf-8"/>
    <title>layui</title>
    <meta name="renderer" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/editor.md/css/editormd.css}"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/jquery.validationEngine/validationEngine.jquery.css}"/>
</head>

<body>
<div class="page-head">
    <ol class="breadcrumb">
        <li>博客管理</li>
        <li>博客列表</li>
        <li class="active">发布博客</li>
        <span style="float: right;"><a href="javascript:void(0)" style="cursor:pointer;" onclick="retArticleList()">&lt;返回</a></span>
    </ol>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="block-flat">
            <div class="content">
                <form class="form-horizontal group-border-dashed" id="add-article-form" style="border-radius: 0px;">
                    <div class="form-group">
                        <label class="col-sm-1 control-label">博客标题</label>
                        <div class="col-sm-6">
                            <input type="text" class="form-control validate[required]" name="articleTitle"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">分类于</label>
                        <div class="col-sm-6">
                            <select class="select2" name="categorySn">
                                <option value="0">暂不分类</option>
                                <option th:each="list : ${categoryList}"
                                        th:value="${list.sn}"
                                        th:text="${list.categoryName}"></option>
                            </select>
                        </div>
                    </div>
                    <!--
                        标签控件（兼容 select2 3.4.5）：
                          上方  : multiple select2，选择已有标签（option value 为 tag sn）
                          下方  : 「新建标签」文本框 + 添加按钮 + 已新增名称气泡列表
                        提交时由 JS 合并为 {existingTagSns:[...], newTagNames:[...]}，
                        与「标签管理」页落到同一张 tag_info + article_tag，AMS 标签云强一致。
                    -->
                    <div class="form-group">
                        <label class="col-sm-1 control-label">标签</label>
                        <div class="col-sm-8">
                            <select class="tag-existing-select" name="existingTagSns"
                                    multiple="multiple" style="width:100%;">
                                <option th:each="t : ${tagList}"
                                        th:value="${t.sn}"
                                        th:text="${t.tagName}"></option>
                            </select>
                            <div style="margin-top:8px; display:flex; gap:6px; align-items:center;">
                                <input type="text" class="form-control tag-new-input"
                                       placeholder="新标签名，按回车或点添加"
                                       style="width:240px; display:inline-block;"/>
                                <button type="button" class="btn btn-sm btn-default tag-new-add-btn">
                                    <i class="fa fa-plus"></i> 添加
                                </button>
                                <span class="tag-new-list" style="display:inline-block;"></span>
                            </div>
                            <small style="color:#8a98a8;">从下拉选已有标签；要新增的标签在下方输入后回车</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">概要</label>
                        <div class="col-sm-8">
                            <textarea class="form-control validate[required]" name="articleSummary"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">博客内容</label>
                        <div class="col-sm-11" id="add-article-editormd">
                            <textarea class="editormd-markdown-textarea" name="test-editormd-markdown-doc" id="editormd"></textarea>
                        </div>
                    </div>
                </form>

                <div class="form-group">
                    <label class="col-sm-1 control-label"></label>
                    <button type="button" class="btn btn-primary" id="publish_blog">立即发布</button>
                    <button type="button" class="btn btn-warning" id="save_draft_btn"
                            style="margin-left:6px;" title="只保存不发布，可在博客列表→草稿 tab 找回继续编辑">
                        <i class="fa fa-save"></i> 保存草稿
                    </button>
                    <button type="reset" class="btn btn-default" onclick="resetBlog()" style="margin-left:6px;">重置</button>
                    <!-- 草稿状态回显：保存后变成"草稿已保存（xx:xx）" -->
                    <span id="draft-status-hint" style="margin-left:12px; color:#8c7900; font-size:13px;"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/statics/plugins/editor.md/editormd.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/jquery.validationEngine/jquery.validationEngine.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/jquery.validationEngine/jquery.validationEngine-zh_CN.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    var __ctx = /*[[@{/}]]*/ '/';
    // AMS 前台站点 base URL（无尾斜杠），由 BmsGlobalModelAttributes 从 mawuya.ams.site-url 注入
    var __amsSiteUrl = /*[[${amsSiteUrl}]]*/ 'http://localhost:8080';
    function _u(p) { return __ctx.replace(/\/$/, '') + p; }
    var __libPath = /*[[@{/statics/plugins/editor.md/lib/}]]*/ '/statics/plugins/editor.md/lib/';
    /*]]>*/

    $(function () {
        $("#add-article-form").validationEngine("attach", {scroll: false});
        // 注意：不要在此处再次调用 App.init()，否则 .cl-vnavigation .parent>a
        // 的 delegate 事件会被重复绑定，造成"展开后立即收回"。这里只做局部初始化。
        if ($.fn.select2) {
            $('#add-article-form .select2').select2({width: '100%'});
            // select2 版本是 3.4.5（2013），不支持 4.x 的 tags+createTag 语法。
            // 这里只做"已有标签多选下拉"。新增标签走旁边的输入框，避免 3.x/4.x API 混用。
            $('#add-article-form select[name="existingTagSns"]').select2({
                width: '100%',
                placeholder: '点击选择已有标签（可多选）',
                allowClear: true
            });
        }
        bindNewTagAdder('#add-article-form');

        var contentEditor = editormd("add-article-editormd", {
            width: false,
            height: 640,
            codeFold: true,
            syncScrolling: "single",
            path: __libPath,
            // 关闭 editormd 自带的"本地上传 → 后端落 DB"。
            // 我们要的是"从资源库选择"：保留 image 工具按钮的可见性，
            // 在 onload 钩子里拦截它的 click，弹出 /bms/image/picker.do 走资源库。
            imageUpload: false,
            imageFormats: ["jpg", "jpeg", "gif", "png", "bmp", "webp"],
            emoji: true,
            taskList: true,
            tocm: true,
            tex: true,
            flowChart: true,
            sequenceDiagram: true,
            // editormd 工具栏渲染完成后才能拿到 image 按钮 DOM，必须在 onload 里拦截
            onload: function () {
                bindImageLibraryPicker(this);
            }
        });

        $("#publish_blog").click(function () {
            var flag = $("#add-article-form").validationEngine("validate");
            if (flag === false) return;
            var content = contentEditor.getMarkdown();
            var title = $('#add-article-form').find('input[name="articleTitle"]').val();
            var categorySn = $('#add-article-form').find('select[name="categorySn"]').val();
            var summary = $('#add-article-form').find('textarea[name="articleSummary"]').val();

            // 如果当前是从已有草稿继续编辑（已 saveDraft 一次得到 sn），
            // 直接走 update → publish 两步保证 sn 一致；
            // 否则走原有"一步 create（立即发布）"路径，避免新增 DB 行。
            if (__currentDraftSn) {
                publishExistingDraft(__currentDraftSn, title, categorySn, summary, content);
            } else {
                createAndPublish(title, categorySn, summary, content);
            }
        });

        // 保存草稿：第一次提交会拿到 sn，后续保存复用同一 sn
        $("#save_draft_btn").click(function () {
            // 草稿仅要求标题不空，正文可以为空（先存草壳子）
            var title = $('#add-article-form').find('input[name="articleTitle"]').val();
            if (!title || !title.trim()) {
                layer.msg('请先填写标题再保存草稿', {icon: 7});
                return;
            }
            var content = contentEditor.getMarkdown();
            var categorySn = $('#add-article-form').find('select[name="categorySn"]').val();
            var summary = $('#add-article-form').find('textarea[name="articleSummary"]').val() || '';
            var tags = collectTagInputs('#add-article-form');

            var data = {
                articleTitle: title,
                categorySn: categorySn,
                articleSummary: summary,
                articleContent: content
            };
            if (__currentDraftSn) data.sn = __currentDraftSn;

            var load = layer.load(0, {shade: [0.1, '#fff']});
            $.ajax({
                type: "post",
                url: _u("/bms/api/article/saveDraft"),
                data: data,
                cache: false,
                dataType: 'json',
                success: function (res) {
                    if (Api.isOk(res)) {
                        if (res && res.data && res.data.sn) {
                            __currentDraftSn = res.data.sn;
                        }
                        // 拿到 sn 后立刻绑定标签，与正文写入保持同一次保存的语义
                        bindArticleTags(__currentDraftSn, tags, function () {
                            layer.close(load);
                            var now = new Date();
                            var hh = ('0' + now.getHours()).slice(-2);
                            var mm = ('0' + now.getMinutes()).slice(-2);
                            $('#draft-status-hint').text('草稿已保存（' + hh + ':' + mm + '）');
                            layer.msg(Api.msg(res, '草稿已保存'), {icon: 1, time: 1000});
                        });
                    } else {
                        layer.close(load);
                        layer.alert(Api.msg(res, '草稿保存失败'),
                                    {skin: 'layui-layer-lan', icon: 2});
                    }
                },
                error: function () {
                    layer.close(load);
                    layer.alert('网络异常，草稿保存失败', {icon: 2});
                }
            });
        });
    });

    // 当前页面下若用户先点了「保存草稿」会拿到一个 sn，发布时改走 update + publish 复用此 sn
    var __currentDraftSn = null;

    /**
     * 读取当前表单的标签提交数据：
     *   existing: 用户在多选 select2 中选中的已有 tag sn 数组（number[]）
     *   created : 用户在「新标签」输入框中累计加入的新名数组（string[]）
     */
    function collectTagInputs(formSelector) {
        var $form = $(formSelector);
        var rawExisting = $form.find('select[name="existingTagSns"]').val() || [];
        var existing = [];
        for (var i = 0; i < rawExisting.length; i++) {
            var n = parseInt(rawExisting[i], 10);
            if (!isNaN(n)) existing.push(n);
        }
        var created = ($form.data('newTagNames') || []).slice();
        return {existing: existing, created: created};
    }

    /**
     * 给「新标签」输入框 + 添加按钮绑事件：
     *   - 回车 / 点按钮 → 把当前输入加进 form 内的内存数组 + 渲染气泡 + 可点 × 移除
     *   - 数据存放：JQuery .data('newTagNames', [...]) 挂在 form 上，提交时统一读出
     * 这种做法避开了 select2 3.4.5 的 tags 模式（4.x 才有），不引入新依赖。
     */
    function bindNewTagAdder(formSelector) {
        var $form = $(formSelector);
        $form.data('newTagNames', []);
        var $input = $form.find('.tag-new-input');
        var $btn = $form.find('.tag-new-add-btn');
        var $list = $form.find('.tag-new-list');

        function render() {
            var arr = $form.data('newTagNames') || [];
            $list.empty();
            for (var i = 0; i < arr.length; i++) {
                var name = arr[i];
                var $chip = $('<span class="tag-new-chip" style="display:inline-block;' +
                              'padding:2px 8px;margin:0 4px 4px 0;background:#eef5ff;' +
                              'border:1px solid #b6d4fe;border-radius:10px;font-size:12px;' +
                              'color:#1d4ed8;"></span>');
                $chip.text(name).attr('data-name', name);
                var $x = $('<a href="javascript:void(0)" style="margin-left:6px;color:#999;">×</a>');
                $x.on('click', (function (n) {
                    return function () {
                        var a = $form.data('newTagNames') || [];
                        $form.data('newTagNames', a.filter(function (x) { return x !== n; }));
                        render();
                    };
                })(name));
                $chip.append($x);
                $list.append($chip);
            }
        }

        function add() {
            var v = ($input.val() || '').trim();
            if (!v) return;
            // 同名去重：已经在已有下拉中选择的名字也不再当成新建
            var arr = $form.data('newTagNames') || [];
            if (arr.indexOf(v) >= 0) { $input.val(''); return; }
            var existingTexts = ($form.find('select[name="existingTagSns"]').select2('data') || [])
                .map(function (x) { return x.text; });
            if (existingTexts.indexOf(v) >= 0) {
                layer.msg('该标签已在已有下拉中选中', {icon: 7, time: 1200});
                $input.val('');
                return;
            }
            arr.push(v);
            $form.data('newTagNames', arr);
            $input.val('');
            render();
        }

        $btn.on('click', add);
        $input.on('keydown', function (e) {
            if (e.which === 13) { // Enter
                e.preventDefault();
                add();
            }
        });
    }

    /**
     * 文章保存成功后绑定标签。
     * <p>失败不阻断主流程：标签绑定异常仅给 toast 提示，文章本身已经成功。</p>
     */
    function bindArticleTags(articleSn, tags, onDone) {
        if (!articleSn || !tags || (tags.existing.length === 0 && tags.created.length === 0)) {
            if (typeof onDone === 'function') onDone();
            return;
        }
        $.ajax({
            type: 'post',
            url: _u('/bms/api/tag/bindArticle'),
            traditional: true,                   // 让 jQuery 把数组按 existingTagSns=1&existingTagSns=2 序列化
            data: {
                articleSn: articleSn,
                existingTagSns: tags.existing,
                newTagNames: tags.created
            },
            dataType: 'json',
            success: function (res) {
                if (!Api.isOk(res)) {
                    layer.msg(Api.msg(res, '标签更新失败（文章已保存）'), {icon: 2, time: 1500});
                }
                if (typeof onDone === 'function') onDone();
            },
            error: function () {
                layer.msg('标签更新失败（文章已保存）', {icon: 2, time: 1500});
                if (typeof onDone === 'function') onDone();
            }
        });
    }

    /** 直接新建并发布（无中间草稿） */
    function createAndPublish(title, categorySn, summary, content) {
        var tags = collectTagInputs('#add-article-form');
        $.ajax({
            type: "post",
            url: _u("/bms/api/article/create"),
            data: {
                "articleTitle": title,
                "categorySn": categorySn,
                "articleSummary": summary,
                "articleContent": content
            },
            cache: false,
            dataType: 'json',
            success: function (res) {
                if (Api.isOk(res)) {
                    // create 当前接口不返回新文章 sn；通过 listAllNoContent 的 ORDER BY sn DESC 找回不够稳妥，
                    // 故没有 sn 时跳过标签绑定（草稿先存→再发布的路径会拿到 sn 走 bindArticleTags）。
                    // 用户场景：点了"立即发布"→ 文章已发布；标签仅在编辑页二次绑定。
                    var newSn = res && res.data && res.data.sn ? res.data.sn : null;
                    if (newSn) {
                        bindArticleTags(newSn, tags, function () { afterPublishSuccess(newSn); });
                    } else {
                        afterPublishSuccess(null);
                    }
                } else {
                    layer.alert(Api.msg(res, '发布失败'),
                                {skin: 'layui-layer-lan', closeBtn: 0, icon: 2});
                }
            }
        });
    }

    /** 已有草稿 → 先 update 写最新内容 → 再 publish 切状态 → 最后绑定标签 */
    function publishExistingDraft(sn, title, categorySn, summary, content) {
        var tags = collectTagInputs('#add-article-form');
        var load = layer.load(0, {shade: [0.1, '#fff']});
        // 先 update（保持 status=DRAFT），更新最新内容
        $.ajax({
            type: 'post',
            url: _u('/bms/api/article/saveDraft'),
            data: {
                sn: sn,
                articleTitle: title,
                categorySn: categorySn,
                articleSummary: summary,
                articleContent: content
            },
            cache: false,
            dataType: 'json',
            success: function (r1) {
                if (!Api.isOk(r1)) {
                    layer.close(load);
                    layer.alert(Api.msg(r1, '更新失败'),
                                {skin: 'layui-layer-lan', icon: 2});
                    return;
                }
                // 再 publish
                $.ajax({
                    type: 'post',
                    url: _u('/bms/api/article/publish'),
                    data: {sn: sn},
                    cache: false,
                    dataType: 'json',
                    success: function (r2) {
                        if (!Api.isOk(r2)) {
                            layer.close(load);
                            layer.alert(Api.msg(r2, '发布失败'),
                                        {skin: 'layui-layer-lan', icon: 2});
                            return;
                        }
                        // 最后绑定标签
                        bindArticleTags(sn, tags, function () {
                            layer.close(load);
                            afterPublishSuccess(sn);
                        });
                    }
                });
            }
        });
    }

    /** 发布成功后的统一提示 + 跳转：传 sn 时跳到详情，否则只跳首页 */
    function afterPublishSuccess(sn) {
        layer.confirm('发布成功！赶快去看看吧', {
            btn: ['去看看', '懒，不去'],
            skin: 'layui-layer-lan',
            anim: 4,
            icon: 1
        }, function (index) {
            retArticleList();
            layer.close(index);
            window.open(__amsSiteUrl + (sn ? ('/' + sn) : '/index'));
        }, function (index) {
            retArticleList();
            layer.close(index);
        });
    }

    function resetBlog() {
        $('.fa-eraser').trigger('click');
    }

    function retArticleList() {
        // 优先方案：在当前 tab 容器内 reload 博客列表（保持 tab 不变）
        var $tab = $('#add-article-form').closest('.tab-pane');
        if ($tab.length) {
            $tab.load(_u('/bms/article/list.do'));
            return;
        }

        // 兜底方案：未在 tab 容器中 → 触发左侧"博客列表"菜单 click，
        // 让 BMS 主框架（js-footer.html 里的 link-li handler）统一处理 tab 切换。
        // 这样不会走 window.location 整页跳转，从而避免 session 边界场景跳登录页。
        var $libLink = $('.link-li', window.parent ? window.parent.document : document)
            .filter(function () {
                return ($(this).attr('link-url') || '').indexOf('/bms/article/list.do') >= 0;
            });
        if ($libLink.length) {
            $libLink.trigger('click');
            return;
        }

        // 极端兜底：左侧菜单都找不到（如直接在新窗口打开本页）才走整页跳转
        window.location.href = _u('/bms/article/list.do');
    }

    // ================================================================
    // editormd 「添加图片」按钮 → 从资源库选择 适配层
    // ----------------------------------------------------------------
    // 多次踩坑后的最终策略：editormd 1.5.x 的 dialog 不一定带 `editormd-dialog-image`
    // 标志类，按钮的 `name` attribute 也不一定是 "image" —— 不同版本/构建产物差异巨大。
    //
    // 因此放弃从"按钮"侧拦截，改从"对话框出现"侧拦截：
    //   1) 用 MutationObserver 全局监听 body 子树新增节点
    //   2) 凡是命中以下任一特征，认为是 editormd 的"添加图片"对话框：
    //        a. class 含 editormd-dialog（editormd 所有弹窗的统一前缀）
    //        b. 内部文本含 "添加图片" / "Add Image"
    //        c. 含 <input> 且 placeholder/label 暗示图片地址
    //   3) 找到后立刻 remove，并改弹我们的图片库 picker
    //   4) 选中后 editor.insertValue("![alt](url)\n") 写入光标
    //
    // 同时绑了一道全局 click 捕获拦截 + .fa-picture-o 检测，作为更早一层的拦截，
    // 大概率能在对话框还没渲染时就 short-circuit。
    // ================================================================
    var __currentEditor = null;
    function bindImageLibraryPicker(editor) {
        __currentEditor = editor;
        if (window._libPickerBound) return;
        window._libPickerBound = true;

        // ----------- 第一道防线：全局 click 捕获 -----------
        // 点击事件命中 .fa-picture-o（图片按钮图标）或 a[name="image"] 时拦截
        document.addEventListener('click', function (e) {
            var t = e.target;
            while (t && t !== document) {
                if (t.nodeType === 1 && t.classList && t.classList.contains('fa-picture-o')) {
                    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                    if (__currentEditor) openImagePicker(__currentEditor);
                    return false;
                }
                if (t.tagName === 'A' && t.getAttribute && t.getAttribute('name') === 'image') {
                    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                    if (__currentEditor) openImagePicker(__currentEditor);
                    return false;
                }
                t = t.parentNode;
            }
        }, true /* useCapture：先于 jQuery 委托 */);

        // ----------- 第二道防线：监听 editormd dialog 被渲染 -----------
        // editormd 所有弹窗都用 `.editormd-dialog` 类前缀；
        // 内部标题中文版含"添加图片"、英文版含"Image"。
        try {
            var lastIntercept = 0;
            var mo = new MutationObserver(function (records) {
                for (var i = 0; i < records.length; i++) {
                    var added = records[i].addedNodes;
                    for (var j = 0; j < added.length; j++) {
                        var n = added[j];
                        if (n.nodeType !== 1) continue;

                        var dlg = matchImageDialog(n);
                        if (!dlg) continue;

                        // 防抖：editormd 内部短时间内可能 append 多个节点（dialog + mask），
                        // 只触发一次 picker
                        var now = Date.now();
                        if (now - lastIntercept < 500) {
                            // 还在抑制窗口，仅清理 dialog 节点不再弹 picker
                            removeDialogTree(dlg);
                            continue;
                        }
                        lastIntercept = now;
                        removeDialogTree(dlg);
                        if (__currentEditor) openImagePicker(__currentEditor);
                    }
                }
            });
            mo.observe(document.body, {childList: true, subtree: true});
        } catch (e) { /* 老浏览器无 MutationObserver，忽略 */ }
    }

    /** 判断一个新加入的 DOM 节点是不是 editormd 的"添加图片"对话框，返回对话框根节点 or null */
    function matchImageDialog(n) {
        // 自身命中
        if (isImageDialog(n)) return n;
        // 子树命中
        if (n.querySelector) {
            // 优先按 class 命中
            var c = n.querySelector('.editormd-dialog-image, .editormd-dialog');
            if (c && isImageDialog(c)) return c;
            // 兜底：按标题文本命中"添加图片"
            var all = n.querySelectorAll && n.querySelectorAll('div, span, h1, h2, h3, header');
            if (all) {
                for (var i = 0; i < all.length; i++) {
                    if ((all[i].textContent || '').indexOf('添加图片') >= 0) {
                        // 向上找最近的 dialog 根
                        var p = all[i];
                        while (p && p !== document.body) {
                            if (p.className && /editormd-dialog|dialog|modal|popup/.test(p.className)) {
                                return p;
                            }
                            p = p.parentNode;
                        }
                        // 找不到 dialog 根，就把含这个标题的最外层节点作为目标
                        return all[i].closest ? (all[i].closest('div') || all[i]) : all[i];
                    }
                }
            }
        }
        return null;
    }

    function isImageDialog(el) {
        if (!el || el.nodeType !== 1 || !el.className) return false;
        var cls = String(el.className);
        if (/editormd-dialog-image/.test(cls)) return true;
        // editormd-dialog 通用类，需要再用文本特征二次确认是图片对话框
        if (/editormd-dialog/.test(cls)) {
            var txt = el.textContent || '';
            if (txt.indexOf('添加图片') >= 0 || /add\s*image/i.test(txt)) return true;
        }
        return false;
    }

    function removeDialogTree(dlg) {
        if (!dlg) return;
        // editormd dialog 通常配套有遮罩层 .editormd-mask，一并清理
        try {
            var masks = document.querySelectorAll('.editormd-mask, .editormd-dialog-mask');
            for (var i = 0; i < masks.length; i++) {
                if (masks[i].parentNode) masks[i].parentNode.removeChild(masks[i]);
            }
        } catch (e) { /* ignore */ }
        if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
    }

    function openImagePicker(editor) {
        // 弹窗尺寸：移动端铺满，桌面端最大 1100×720 但不超出视口
        var isMobile = window.innerWidth <= 600;
        var iw = Math.min(window.innerWidth - 40, 1100);
        var ih = Math.min(window.innerHeight - 40, 720);
        var areaW = isMobile ? '100%' : iw + 'px';
        var areaH = isMobile ? '100%' : ih + 'px';

        var pickerLayer = layer.open({
            type: 2,
            title: '从图片库选择',
            skin: 'layui-layer-lan',
            shadeClose: false,
            maxmin: !isMobile,
            area: [areaW, areaH],
            content: _u('/bms/image/picker.do')
        });

        // picker iframe 内调 parent.__onImagePicked(item) 回调
        window.__onImagePicked = function (item) {
            if (!item || !item.url) {
                layer.msg('选择失败', {icon: 2});
                return;
            }
            // 生成 markdown 图片语法，使用 file_name 作为 alt（兜底"图片"）
            // 注意把 alt 与 url 内可能的 ] / ) 做转义，避免破坏 markdown 语法
            var alt = (item.name || '图片').replace(/\]/g, '\\]');
            var url = String(item.url).replace(/\)/g, '%29');
            var md = '![' + alt + '](' + url + ')\n';
            // editormd 公开 API：在光标位置插入文本并保留焦点
            editor.insertValue(md);
            layer.close(pickerLayer);
            layer.msg('已插入图片', {icon: 1, time: 800});
        };
        window.__onImagePickerCancel = function () {
            layer.close(pickerLayer);
        };
        window.__onImagePickerGotoLibrary = function () {
            layer.close(pickerLayer);
            // 文章编辑页跳出到图片库 tab（沿用 article_list 同款 link-li click 路径）
            var $libLink = $('.link-li').filter(function () {
                return ($(this).attr('link-url') || '').indexOf('/bms/image/library.do') >= 0;
            });
            if ($libLink.length) {
                $libLink.trigger('click');
            } else {
                layer.msg('未找到图片库菜单，请联系管理员', {icon: 7});
            }
        };
    }
</script>
