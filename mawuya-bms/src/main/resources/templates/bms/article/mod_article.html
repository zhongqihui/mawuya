<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #ffffff !important;">
<head>
    <meta charset="utf-8"/>
    <title>layui</title>
    <meta name="renderer" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/editor.md/css/editormd.css}"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/jquery.validationEngine/validationEngine.jquery.css}"/>
</head>

<body>
<style>
    /* 文章当前状态徽章（编辑页顶部） */
    .article-status-badge {
        display: inline-block;
        padding: 2px 10px;
        margin-left: 8px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 500;
        vertical-align: middle;
    }
    .article-status-badge.status-0 { color:#8c7900; background:#fff8d6; border:1px solid #ffe66e; }
    .article-status-badge.status-1 { color:#1d8b3a; background:#e6f7ea; border:1px solid #a3deb1; }
    .article-status-badge.status-2 { color:#a13d3d; background:#fbeaea; border:1px solid #e9b4b4; }

    /* 状态流转时间线 */
    .status-timeline { list-style:none; padding:0; margin:8px 0 0; }
    .status-timeline li {
        position: relative;
        padding: 6px 0 6px 22px;
        font-size: 13px;
        color: #5a6c80;
        border-left: 2px solid #e5e9ef;
        margin-left: 6px;
    }
    .status-timeline li:before {
        content: "";
        position: absolute;
        left: -7px;
        top: 11px;
        width: 12px;
        height: 12px;
        background: #2494f2;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px #2494f2;
    }
    .status-timeline .meta { color: #8a98a8; margin-left: 8px; font-size: 12px; }
</style>
<div class="page-head">
    <ol class="breadcrumb">
        <li>博客管理</li>
        <li>博客列表</li>
        <li class="active">博客修改</li>
        <!-- 当前状态徽章 -->
        <span th:if="${article.status == 0}"   class="article-status-badge status-0">草稿</span>
        <span th:if="${article.status == 1 or article.status == null}" class="article-status-badge status-1">已发布</span>
        <span th:if="${article.status == 2}"   class="article-status-badge status-2">已撤回</span>
        <span style="float: right;"><a href="javascript:void(0)" style="cursor:pointer;" onclick="retArticleList()">&lt;返回</a></span>
    </ol>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="block-flat">
            <div class="content">
                <form class="form-horizontal group-border-dashed" id="mod-article-form" style="border-radius: 0px;">
                    <input type="hidden" name="sn" th:value="${article.sn}"/>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">博客标题</label>
                        <div class="col-sm-6">
                            <input type="text" class="form-control validate[required]" name="articleTitle"
                                   th:value="${article.articleTitle}"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">分类于</label>
                        <div class="col-sm-6">
                            <select class="select2" name="categorySn">
                                <option value="0" th:selected="${article.categorySn == 0}">暂不分类</option>
                                <option th:each="list : ${categoryList}"
                                        th:value="${list.sn}"
                                        th:text="${list.categoryName}"
                                        th:selected="${list.sn == article.categorySn}"></option>
                            </select>
                        </div>
                    </div>
                    <!--
                        标签控件（兼容 select2 3.4.5）：
                          上方  : multiple select2，从 tag_info 下拉选择已有标签，
                                  当前文章已关联的 sn 通过 th:selected 回填
                          下方  : 「新标签」输入框 + 添加按钮 + 已新增名称气泡
                        提交时 collectTagInputs() 合并出 {existing, created} 调 /tag/bindArticle。
                    -->
                    <div class="form-group">
                        <label class="col-sm-1 control-label">标签</label>
                        <div class="col-sm-8">
                            <select class="tag-existing-select" name="existingTagSns"
                                    multiple="multiple" style="width:100%;">
                                <option th:each="t : ${tagList}"
                                        th:value="${t.sn}"
                                        th:text="${t.tagName}"
                                        th:selected="${selectedTagSnSet != null and selectedTagSnSet.contains(t.sn)}"></option>
                            </select>
                            <div style="margin-top:8px; display:flex; gap:6px; align-items:center;">
                                <input type="text" class="form-control tag-new-input"
                                       placeholder="新标签名，按回车或点添加"
                                       style="width:240px; display:inline-block;"/>
                                <button type="button" class="btn btn-sm btn-default tag-new-add-btn">
                                    <i class="fa fa-plus"></i> 添加
                                </button>
                                <span class="tag-new-list" style="display:inline-block;"></span>
                            </div>
                            <small style="color:#8a98a8;">从下拉选已有标签；要新增的标签在下方输入后回车</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">概要</label>
                        <div class="col-sm-8">
                            <textarea class="form-control validate[required]" name="articleSummary"
                                      th:text="${article.articleSummary}"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">博客内容</label>
                        <div class="col-sm-11" id="mod-article-editormd">
                            <textarea class="editormd-markdown-textarea" name="test-editormd-markdown-doc"
                                      id="editormd" th:text="${article.articleContent}"></textarea>
                        </div>
                    </div>
                </form>

                <div class="form-group">
                    <label class="col-sm-1 control-label"></label>
                    <!--
                        按钮可见性与文章当前状态绑定：
                          已发布(1) : [立即修改]（保持已发布） + [撤回]
                          草稿(0)   : [保存草稿] + [发布]
                          已撤回(2) : [保存修改]（保持已撤回） + [重新发布]
                    -->
                    <button type="button" class="btn btn-primary" id="mod_blog_btn"
                            th:if="${article.status == 1 or article.status == null}">立即修改</button>
                    <button type="button" class="btn btn-default" id="withdraw_blog_btn"
                            th:if="${article.status == 1 or article.status == null}"
                            style="margin-left:6px; color:#a13d3d;">
                        <i class="fa fa-undo"></i> 撤回
                    </button>

                    <button type="button" class="btn btn-warning" id="save_draft_btn"
                            th:if="${article.status == 0}">
                        <i class="fa fa-save"></i> 保存草稿
                    </button>
                    <button type="button" class="btn btn-success" id="publish_draft_btn"
                            th:if="${article.status == 0}" style="margin-left:6px;">
                        <i class="fa fa-paper-plane"></i> 发布
                    </button>

                    <button type="button" class="btn btn-default" id="save_withdrawn_btn"
                            th:if="${article.status == 2}">
                        <i class="fa fa-save"></i> 保存修改
                    </button>
                    <button type="button" class="btn btn-success" id="republish_btn"
                            th:if="${article.status == 2}" style="margin-left:6px;">
                        <i class="fa fa-share-square-o"></i> 重新发布
                    </button>

                    <button type="reset" class="btn btn-default" onclick="resetBlog()" style="margin-left:6px;">重置</button>
                </div>

                <!-- 状态流转时间线 -->
                <div class="form-group" th:if="${statusLogs != null and !statusLogs.isEmpty()}">
                    <label class="col-sm-1 control-label">状态记录</label>
                    <div class="col-sm-11">
                        <ul class="status-timeline">
                            <li th:each="log : ${statusLogs}">
                                <span th:switch="${log.action}">
                                    <span th:case="'CREATE_DRAFT'">创建草稿</span>
                                    <span th:case="'CREATE_PUBLISHED'">创建并发布</span>
                                    <span th:case="'UPDATE_DRAFT'">更新内容</span>
                                    <span th:case="'UPDATE_PUBLISHED'">更新内容</span>
                                    <span th:case="'PUBLISH'">发布</span>
                                    <span th:case="'WITHDRAW'">撤回</span>
                                    <span th:case="'REPUBLISH'">重新发布</span>
                                    <span th:case="*" th:text="${log.action}">变更</span>
                                </span>
                                <span class="meta" th:text="${log.changeTime}"></span>
                                <span class="meta" th:if="${log.operator != null}"
                                      th:text="'by ' + ${log.operator}"></span>
                                <span class="meta" th:if="${log.remark != null and !#strings.isEmpty(log.remark)}"
                                      th:text="'· ' + ${log.remark}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/statics/plugins/editor.md/editormd.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/jquery.validationEngine/jquery.validationEngine.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/jquery.validationEngine/jquery.validationEngine-zh_CN.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    var __ctx = /*[[@{/}]]*/ '/';
    // AMS 前台站点 base URL（无尾斜杠），由 BmsGlobalModelAttributes 从 mawuya.ams.site-url 注入
    var __amsSiteUrl = /*[[${amsSiteUrl}]]*/ 'http://localhost:8080';
    function _u(p) { return __ctx.replace(/\/$/, '') + p; }
    var __libPath = /*[[@{/statics/plugins/editor.md/lib/}]]*/ '/statics/plugins/editor.md/lib/';
    /*]]>*/

    $(function () {
        $("#mod-article-form").validationEngine("attach", {scroll: false});
        // 注意：不要在此处再次调用 App.init()，否则 .cl-vnavigation .parent>a
        // 的 delegate 事件会被重复绑定，造成"展开后立即收回"。这里只做局部初始化。
        if ($.fn.select2) {
            $('#mod-article-form .select2').select2({width: '100%'});
            // 已有标签下拉：select2 3.4.5 multiple；新增标签走旁边输入框，避免 4.x tags API
            $('#mod-article-form select[name="existingTagSns"]').select2({
                width: '100%',
                placeholder: '点击选择已有标签（可多选）',
                allowClear: true
            });
        }
        bindNewTagAdder('#mod-article-form');

        // editor 就绪标志：在 editormd onload 完成前，按钮点击直接提示"加载中"，
        // 避免出现 contentEditor.getMarkdown 抛 "x is not a function" → click handler
        // 静默吞异常 → "按钮点了完全没反应"的体验。
        var editorReady = false;
        var contentEditor = editormd("mod-article-editormd", {
            width: false,
            height: 640,
            codeFold: true,
            syncScrolling: "single",
            path: __libPath,
            // 关闭 editormd 自带的"本地上传 → 后端落 DB"。
            // 我们要的是"从资源库选择"：保留 image 工具按钮的可见性，
            // 在 onload 钩子里拦截它的 click，弹出 /bms/image/picker.do 走资源库。
            imageUpload: false,
            imageFormats: ["jpg", "jpeg", "gif", "png", "bmp", "webp"],
            emoji: true,
            taskList: true,
            tocm: true,
            tex: true,
            flowChart: true,
            sequenceDiagram: true,
            onload: function () {
                editorReady = true;
                bindImageLibraryPicker(this);
            }
        });

        /** 安全读取正文：editor 未 ready 时返回 null（提示后中断后续逻辑） */
        function safeGetMarkdown() {
            if (!editorReady || !contentEditor || typeof contentEditor.getMarkdown !== 'function') {
                layer.msg('编辑器还在加载，请稍候再操作…', {icon: 7});
                return null;
            }
            try {
                return contentEditor.getMarkdown();
            } catch (e) {
                layer.alert('读取编辑器内容失败：' + (e && e.message ? e.message : e),
                            {skin: 'layui-layer-lan', icon: 2});
                return null;
            }
        }

        $("#mod_blog_btn").click(function () {
            if (!validateForm()) return;
            var md = safeGetMarkdown(); if (md === null) return;
            submitUpdate(md, function (sn) { afterModifySuccess(sn); });
        });

        // 草稿场景：保存草稿（保持 status=DRAFT）
        $("#save_draft_btn").click(function () {
            var sn = $('#mod-article-form').find('input[name="sn"]').val();
            var title = $('#mod-article-form').find('input[name="articleTitle"]').val();
            if (!title || !title.trim()) {
                layer.msg('标题不能为空', {icon: 7});
                return;
            }
            var content = safeGetMarkdown(); if (content === null) return;
            var categorySn = $('#mod-article-form').find('select[name="categorySn"]').val();
            var summary = $('#mod-article-form').find('textarea[name="articleSummary"]').val() || '';

            var load = layer.load(0, {shade: [0.1, '#fff']});
            $.ajax({
                type: 'post',
                url: _u('/bms/api/article/saveDraft'),
                data: {
                    sn: sn,
                    articleTitle: title,
                    categorySn: categorySn,
                    articleSummary: summary,
                    articleContent: content
                },
                cache: false,
                dataType: 'json',
                success: function (res) {
                    layer.close(load);
                    if (Api.isOk(res)) {
                        layer.msg(Api.msg(res, '草稿已保存'), {icon: 1, time: 1000});
                    } else {
                        layer.alert(Api.msg(res, '草稿保存失败'),
                                    {skin: 'layui-layer-lan', icon: 2});
                    }
                },
                error: function (xhr) {
                    layer.close(load);
                    layer.alert('请求失败：' + (xhr && xhr.status ? xhr.status : '网络异常'),
                                {skin: 'layui-layer-lan', icon: 2});
                }
            });
        });

        // 草稿 → 发布：先保存最新内容，再发布
        $("#publish_draft_btn").click(function () {
            if (!validateForm()) return;
            var md = safeGetMarkdown(); if (md === null) return;
            submitUpdateAsDraft(md, function (sn) {
                doStatusTransfer('/bms/api/article/publish', sn, '已发布', function () {
                    afterModifySuccess(sn);
                });
            });
        });

        // 已发布 → 撤回：弹窗收集 remark（不读编辑器内容，跟 editor ready 无关）
        $("#withdraw_blog_btn").click(function () {
            var sn = $('#mod-article-form').find('input[name="sn"]').val();
            layer.prompt({
                formType: 2,
                title: '撤回原因（可选，便于事后回溯）',
                skin: 'layui-layer-lan',
                maxlength: 200,
                value: ''
            }, function (remark, index) {
                var load = layer.load(0, {shade: [0.1, '#fff']});
                $.ajax({
                    type: 'post',
                    url: _u('/bms/api/article/withdraw'),
                    data: {sn: sn, remark: remark || ''},
                    cache: false,
                    dataType: 'json',
                    success: function (res) {
                        layer.close(load);
                        layer.close(index);
                        if (Api.isOk(res)) {
                            layer.msg(Api.msg(res, '已撤回'), {icon: 1, time: 1000});
                            // 撤回成功后直接回博客列表，便于在「已撤回」tab 看见状态变化
                            setTimeout(function () { retArticleList(); }, 600);
                        } else {
                            layer.alert(Api.msg(res, '撤回失败'),
                                        {skin: 'layui-layer-lan', icon: 2});
                        }
                    },
                    error: function (xhr) {
                        layer.close(load);
                        layer.alert('请求失败：' + (xhr && xhr.status ? xhr.status : '网络异常'),
                                    {skin: 'layui-layer-lan', icon: 2});
                    }
                });
            });
        });

        // 已撤回 → 保存修改（保持 status=WITHDRAWN）
        $("#save_withdrawn_btn").click(function () {
            if (!validateForm()) return;
            var md = safeGetMarkdown(); if (md === null) return;
            // 已撤回的"保存修改"走 /update（保持当前状态）
            submitUpdate(md, function () {
                layer.msg('已保存修改（仍处于已撤回状态）', {icon: 1, time: 1200});
            });
        });

        // 已撤回 → 重新发布：先 update 最新内容，再 republish
        $("#republish_btn").click(function () {
            if (!validateForm()) return;
            var md = safeGetMarkdown(); if (md === null) return;
            submitUpdate(md, function (sn) {
                doStatusTransfer('/bms/api/article/republish', sn, '已重新发布', function () {
                    afterModifySuccess(sn);
                });
            });
        });
    });

    /**
     * 表单校验封装：调一次 validationEngine 并兜底处理。
     *
     * <p>避免在多个 handler / submitUpdate 内部重复 validate（重复校验在 jQuery
     * validationEngine 1.4.x 上有低概率把第二次结果错误地置 false，
     * 表现就是"按钮点了完全没反应"——本次 bug 的根因即此。</p>
     */
    function validateForm() {
        var flag = $("#mod-article-form").validationEngine("validate");
        return flag !== false;
    }

    /**
     * 读取当前表单的标签提交数据：
     *   existing: 多选 select2 中选中的已有 tag sn 数组（number[]）
     *   created : 「新标签」输入框中累计加入的新名数组（string[]）
     */
    function collectTagInputs() {
        var $form = $('#mod-article-form');
        var rawExisting = $form.find('select[name="existingTagSns"]').val() || [];
        var existing = [];
        for (var i = 0; i < rawExisting.length; i++) {
            var n = parseInt(rawExisting[i], 10);
            if (!isNaN(n)) existing.push(n);
        }
        var created = ($form.data('newTagNames') || []).slice();
        return {existing: existing, created: created};
    }

    /** 与 write_article.html 同款实现：新标签输入框 + 添加按钮 + 气泡列表 */
    function bindNewTagAdder(formSelector) {
        var $form = $(formSelector);
        $form.data('newTagNames', []);
        var $input = $form.find('.tag-new-input');
        var $btn = $form.find('.tag-new-add-btn');
        var $list = $form.find('.tag-new-list');

        function render() {
            var arr = $form.data('newTagNames') || [];
            $list.empty();
            for (var i = 0; i < arr.length; i++) {
                var name = arr[i];
                var $chip = $('<span class="tag-new-chip" style="display:inline-block;' +
                              'padding:2px 8px;margin:0 4px 4px 0;background:#eef5ff;' +
                              'border:1px solid #b6d4fe;border-radius:10px;font-size:12px;' +
                              'color:#1d4ed8;"></span>');
                $chip.text(name).attr('data-name', name);
                var $x = $('<a href="javascript:void(0)" style="margin-left:6px;color:#999;">×</a>');
                $x.on('click', (function (n) {
                    return function () {
                        var a = $form.data('newTagNames') || [];
                        $form.data('newTagNames', a.filter(function (x) { return x !== n; }));
                        render();
                    };
                })(name));
                $chip.append($x);
                $list.append($chip);
            }
        }

        function add() {
            var v = ($input.val() || '').trim();
            if (!v) return;
            var arr = $form.data('newTagNames') || [];
            if (arr.indexOf(v) >= 0) { $input.val(''); return; }
            var existingTexts = ($form.find('select[name="existingTagSns"]').select2('data') || [])
                .map(function (x) { return x.text; });
            if (existingTexts.indexOf(v) >= 0) {
                layer.msg('该标签已在已有下拉中选中', {icon: 7, time: 1200});
                $input.val('');
                return;
            }
            arr.push(v);
            $form.data('newTagNames', arr);
            $input.val('');
            render();
        }

        $btn.on('click', add);
        $input.on('keydown', function (e) {
            if (e.which === 13) {
                e.preventDefault();
                add();
            }
        });
    }

    /** 文章修改成功后同步标签关联（失败不阻断主流程） */
    function syncArticleTags(sn, onDone) {
        var tags = collectTagInputs();
        $.ajax({
            type: 'post',
            url: _u('/bms/api/tag/bindArticle'),
            traditional: true,
            data: {
                articleSn: sn,
                existingTagSns: tags.existing,
                newTagNames: tags.created
            },
            dataType: 'json',
            success: function (res) {
                if (!Api.isOk(res)) {
                    layer.msg(Api.msg(res, '标签更新失败（正文已保存）'), {icon: 2, time: 1500});
                }
                if (typeof onDone === 'function') onDone();
            },
            error: function () {
                layer.msg('标签更新失败（正文已保存）', {icon: 2, time: 1500});
                if (typeof onDone === 'function') onDone();
            }
        });
    }

    /** 提交「保持当前状态」的更新（已发布/已撤回都走这个）。content 由调用方预读，避免在内部再访问 editor。 */
    function submitUpdate(content, onSuccess) {
        var sn = $('#mod-article-form').find('input[name="sn"]').val();
        var title = $('#mod-article-form').find('input[name="articleTitle"]').val();
        var categorySn = $('#mod-article-form').find('select[name="categorySn"]').val();
        var summary = $('#mod-article-form').find('textarea[name="articleSummary"]').val();

        var load = layer.load(0, {shade: [0.1, '#fff']});
        $.ajax({
            type: "post",
            url: _u("/bms/api/article/update"),
            data: {
                "sn": sn,
                "articleTitle": title,
                "categorySn": categorySn,
                "articleSummary": summary,
                "articleContent": content
            },
            cache: false,
            dataType: 'json',
            success: function (res) {
                if (Api.isOk(res)) {
                    syncArticleTags(sn, function () {
                        layer.close(load);
                        if (typeof onSuccess === 'function') onSuccess(sn);
                    });
                } else {
                    layer.close(load);
                    layer.alert(Api.msg(res, '修改失败'),
                                {skin: 'layui-layer-lan', closeBtn: 0, icon: 2});
                }
            },
            error: function (xhr) {
                layer.close(load);
                layer.alert('请求失败：' + (xhr && xhr.status ? xhr.status : '网络异常'),
                            {skin: 'layui-layer-lan', icon: 2});
            }
        });
    }

    /** 草稿专用：使用 saveDraft 端点更新（status 保持 DRAFT）。content 由调用方预读。 */
    function submitUpdateAsDraft(content, onSuccess) {
        var sn = $('#mod-article-form').find('input[name="sn"]').val();
        var title = $('#mod-article-form').find('input[name="articleTitle"]').val();
        var categorySn = $('#mod-article-form').find('select[name="categorySn"]').val();
        var summary = $('#mod-article-form').find('textarea[name="articleSummary"]').val();

        var load = layer.load(0, {shade: [0.1, '#fff']});
        $.ajax({
            type: "post",
            url: _u("/bms/api/article/saveDraft"),
            data: {
                "sn": sn,
                "articleTitle": title,
                "categorySn": categorySn,
                "articleSummary": summary,
                "articleContent": content
            },
            cache: false,
            dataType: 'json',
            success: function (res) {
                if (Api.isOk(res)) {
                    syncArticleTags(sn, function () {
                        layer.close(load);
                        if (typeof onSuccess === 'function') onSuccess(sn);
                    });
                } else {
                    layer.close(load);
                    layer.alert(Api.msg(res, '保存失败'),
                                {skin: 'layui-layer-lan', closeBtn: 0, icon: 2});
                }
            },
            error: function (xhr) {
                layer.close(load);
                layer.alert('请求失败：' + (xhr && xhr.status ? xhr.status : '网络异常'),
                            {skin: 'layui-layer-lan', icon: 2});
            }
        });
    }

    /** 状态切换 POST：publish / republish（withdraw 走专用 prompt 路径） */
    function doStatusTransfer(path, sn, okMsg, onOk) {
        var load = layer.load(0, {shade: [0.1, '#fff']});
        $.ajax({
            type: 'post',
            url: _u(path),
            data: {sn: sn},
            cache: false,
            dataType: 'json',
            success: function (res) {
                layer.close(load);
                if (Api.isOk(res)) {
                    layer.msg(Api.msg(res, okMsg), {icon: 1, time: 800});
                    if (typeof onOk === 'function') onOk();
                } else {
                    layer.alert(Api.msg(res, '操作失败'),
                                {skin: 'layui-layer-lan', icon: 2});
                }
            },
            error: function (xhr) {
                layer.close(load);
                layer.alert('请求失败：' + (xhr && xhr.status ? xhr.status : '网络异常'),
                            {skin: 'layui-layer-lan', icon: 2});
            }
        });
    }

    /** 修改成功后的统一交互：回到列表 + 弹"去看看"提示 */
    function afterModifySuccess(sn) {
        layer.confirm('操作成功！赶快去看看吧', {
            btn: ['去看看', '懒，不去'],
            skin: 'layui-layer-lan',
            anim: 4,
            icon: 1
        }, function (index) {
            layer.close(index);
            retArticleList();
            window.open(__amsSiteUrl + '/' + sn);
        }, function (index) {
            layer.close(index);
            retArticleList();
        });
    }

    function resetBlog() { /* no-op */ }

    function retArticleList() {
        // 优先方案：在当前 tab 容器内 reload 博客列表（保持 tab 不变）
        var $tab = $('#mod-article-form').closest('.tab-pane');
        if ($tab.length) {
            $tab.load(_u('/bms/article/list.do'));
            return;
        }

        // 兜底方案：未在 tab 容器中 → 触发左侧"博客列表"菜单 click，
        // 让 BMS 主框架（js-footer.html 里的 link-li handler）统一处理 tab 切换。
        // 这样不会走 window.location 整页跳转，从而避免 session 边界场景跳登录页。
        var $libLink = $('.link-li', window.parent ? window.parent.document : document)
            .filter(function () {
                return ($(this).attr('link-url') || '').indexOf('/bms/article/list.do') >= 0;
            });
        if ($libLink.length) {
            $libLink.trigger('click');
            return;
        }

        // 极端兜底：左侧菜单都找不到（如直接在新窗口打开本页）才走整页跳转
        window.location.href = _u('/bms/article/list.do');
    }

    // ================================================================
    // editormd 「添加图片」按钮 → 从资源库选择 适配层
    // ----------------------------------------------------------------
    // 与 write_article.html 共用一套实现，详情见 write_article.html 同名注释。
    // 之所以不抽 .js 公共文件：本系统并无 bms 端的统一 js 入口，
    // 两个模板复用同份代码、便于阅读 + Thymeleaf 改造时本地可见。
    // ================================================================
    // ================================================================
    // editormd 「添加图片」按钮 → 从资源库选择 适配层
    // 详细注释见 write_article.html 同名函数。核心策略：
    //   - 全局 click 捕获：拦 .fa-picture-o 或 a[name="image"]
    //   - MutationObserver 兜底：监听 editormd dialog 被 append 即移除并补弹 picker
    //   - 通过 textContent 含 "添加图片" 二次确认是图片对话框
    // ================================================================
    var __currentEditor = null;
    function bindImageLibraryPicker(editor) {
        __currentEditor = editor;
        if (window._libPickerBound) return;
        window._libPickerBound = true;

        document.addEventListener('click', function (e) {
            var t = e.target;
            while (t && t !== document) {
                if (t.nodeType === 1 && t.classList && t.classList.contains('fa-picture-o')) {
                    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                    if (__currentEditor) openImagePicker(__currentEditor);
                    return false;
                }
                if (t.tagName === 'A' && t.getAttribute && t.getAttribute('name') === 'image') {
                    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                    if (__currentEditor) openImagePicker(__currentEditor);
                    return false;
                }
                t = t.parentNode;
            }
        }, true /* useCapture */);

        try {
            var lastIntercept = 0;
            var mo = new MutationObserver(function (records) {
                for (var i = 0; i < records.length; i++) {
                    var added = records[i].addedNodes;
                    for (var j = 0; j < added.length; j++) {
                        var n = added[j];
                        if (n.nodeType !== 1) continue;
                        var dlg = matchImageDialog(n);
                        if (!dlg) continue;
                        var now = Date.now();
                        if (now - lastIntercept < 500) {
                            removeDialogTree(dlg);
                            continue;
                        }
                        lastIntercept = now;
                        removeDialogTree(dlg);
                        if (__currentEditor) openImagePicker(__currentEditor);
                    }
                }
            });
            mo.observe(document.body, {childList: true, subtree: true});
        } catch (e) { /* ignore */ }
    }

    function matchImageDialog(n) {
        if (isImageDialog(n)) return n;
        if (n.querySelector) {
            var c = n.querySelector('.editormd-dialog-image, .editormd-dialog');
            if (c && isImageDialog(c)) return c;
            var all = n.querySelectorAll && n.querySelectorAll('div, span, h1, h2, h3, header');
            if (all) {
                for (var i = 0; i < all.length; i++) {
                    if ((all[i].textContent || '').indexOf('添加图片') >= 0) {
                        var p = all[i];
                        while (p && p !== document.body) {
                            if (p.className && /editormd-dialog|dialog|modal|popup/.test(p.className)) {
                                return p;
                            }
                            p = p.parentNode;
                        }
                        return all[i].closest ? (all[i].closest('div') || all[i]) : all[i];
                    }
                }
            }
        }
        return null;
    }
    function isImageDialog(el) {
        if (!el || el.nodeType !== 1 || !el.className) return false;
        var cls = String(el.className);
        if (/editormd-dialog-image/.test(cls)) return true;
        if (/editormd-dialog/.test(cls)) {
            var txt = el.textContent || '';
            if (txt.indexOf('添加图片') >= 0 || /add\s*image/i.test(txt)) return true;
        }
        return false;
    }
    function removeDialogTree(dlg) {
        if (!dlg) return;
        try {
            var masks = document.querySelectorAll('.editormd-mask, .editormd-dialog-mask');
            for (var i = 0; i < masks.length; i++) {
                if (masks[i].parentNode) masks[i].parentNode.removeChild(masks[i]);
            }
        } catch (e) { /* ignore */ }
        if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
    }

    function openImagePicker(editor) {
        var isMobile = window.innerWidth <= 600;
        var iw = Math.min(window.innerWidth - 40, 1100);
        var ih = Math.min(window.innerHeight - 40, 720);
        var areaW = isMobile ? '100%' : iw + 'px';
        var areaH = isMobile ? '100%' : ih + 'px';

        var pickerLayer = layer.open({
            type: 2,
            title: '从图片库选择',
            skin: 'layui-layer-lan',
            shadeClose: false,
            maxmin: !isMobile,
            area: [areaW, areaH],
            content: _u('/bms/image/picker.do')
        });

        window.__onImagePicked = function (item) {
            if (!item || !item.url) {
                layer.msg('选择失败', {icon: 2});
                return;
            }
            var alt = (item.name || '图片').replace(/\]/g, '\\]');
            var url = String(item.url).replace(/\)/g, '%29');
            var md = '![' + alt + '](' + url + ')\n';
            editor.insertValue(md);
            layer.close(pickerLayer);
            layer.msg('已插入图片', {icon: 1, time: 800});
        };
        window.__onImagePickerCancel = function () {
            layer.close(pickerLayer);
        };
        window.__onImagePickerGotoLibrary = function () {
            layer.close(pickerLayer);
            var $libLink = $('.link-li').filter(function () {
                return ($(this).attr('link-url') || '').indexOf('/bms/image/library.do') >= 0;
            });
            if ($libLink.length) {
                $libLink.trigger('click');
            } else {
                layer.msg('未找到图片库菜单，请联系管理员', {icon: 7});
            }
        };
    }
</script>
