<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #ffffff !important;">
<head>
    <meta charset="utf-8"/>
    <title>layui</title>
    <meta name="renderer" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/editor.md/css/editormd.css}"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/jquery.validationEngine/validationEngine.jquery.css}"/>
</head>

<body>
<div class="page-head">
    <ol class="breadcrumb">
        <li>博客管理</li>
        <li>博客列表</li>
        <li class="active">博客修改</li>
        <span style="float: right;"><a href="javascript:void(0)" style="cursor:pointer;" onclick="retArticleList()">&lt;返回</a></span>
    </ol>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="block-flat">
            <div class="content">
                <form class="form-horizontal group-border-dashed" id="mod-article-form" style="border-radius: 0px;">
                    <input type="hidden" name="sn" th:value="${article.sn}"/>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">博客标题</label>
                        <div class="col-sm-6">
                            <input type="text" class="form-control validate[required]" name="articleTitle"
                                   th:value="${article.articleTitle}"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">分类于</label>
                        <div class="col-sm-6">
                            <select class="select2" name="categorySn">
                                <option value="0" th:selected="${article.categorySn == 0}">暂不分类</option>
                                <option th:each="list : ${categoryList}"
                                        th:value="${list.sn}"
                                        th:text="${list.categoryName}"
                                        th:selected="${list.sn == article.categorySn}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">概要</label>
                        <div class="col-sm-8">
                            <textarea class="form-control validate[required]" name="articleSummary"
                                      th:text="${article.articleSummary}"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label">博客内容</label>
                        <div class="col-sm-11" id="mod-article-editormd">
                            <textarea class="editormd-markdown-textarea" name="test-editormd-markdown-doc"
                                      id="editormd" th:text="${article.articleContent}"></textarea>
                        </div>
                    </div>
                </form>

                <div class="form-group">
                    <label class="col-sm-1 control-label"></label>
                    <button type="button" class="btn btn-primary" id="mod_blog_btn">立即修改</button>
                    <button type="reset" class="btn btn-default" onclick="resetBlog()">重置</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/statics/plugins/editor.md/editormd.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/jquery.validationEngine/jquery.validationEngine.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/jquery.validationEngine/jquery.validationEngine-zh_CN.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    var __ctx = /*[[@{/}]]*/ '/';
    // AMS 前台站点 base URL（无尾斜杠），由 BmsGlobalModelAttributes 从 mawuya.ams.site-url 注入
    var __amsSiteUrl = /*[[${amsSiteUrl}]]*/ 'http://localhost:8080';
    function _u(p) { return __ctx.replace(/\/$/, '') + p; }
    var __libPath = /*[[@{/statics/plugins/editor.md/lib/}]]*/ '/statics/plugins/editor.md/lib/';
    /*]]>*/

    $(function () {
        $("#mod-article-form").validationEngine("attach", {scroll: false});
        // 注意：不要在此处再次调用 App.init()，否则 .cl-vnavigation .parent>a
        // 的 delegate 事件会被重复绑定，造成"展开后立即收回"。这里只做局部初始化。
        if ($.fn.select2) { $('#mod-article-form .select2').select2({width: '100%'}); }

        var contentEditor = editormd("mod-article-editormd", {
            width: false,
            height: 640,
            codeFold: true,
            syncScrolling: "single",
            path: __libPath,
            // 关闭 editormd 自带的"本地上传 → 后端落 DB"。
            // 我们要的是"从资源库选择"：保留 image 工具按钮的可见性，
            // 在 onload 钩子里拦截它的 click，弹出 /bms/image/picker.do 走资源库。
            imageUpload: false,
            imageFormats: ["jpg", "jpeg", "gif", "png", "bmp", "webp"],
            emoji: true,
            taskList: true,
            tocm: true,
            tex: true,
            flowChart: true,
            sequenceDiagram: true,
            onload: function () {
                bindImageLibraryPicker(this);
            }
        });

        $("#mod_blog_btn").click(function () {
            var flag = $("#mod-article-form").validationEngine("validate");
            if (flag === false) return;
            var content = contentEditor.getMarkdown();
            var sn = $('#mod-article-form').find('input[name="sn"]').val();
            var title = $('#mod-article-form').find('input[name="articleTitle"]').val();
            var categorySn = $('#mod-article-form').find('select[name="categorySn"]').val();
            var summary = $('#mod-article-form').find('textarea[name="articleSummary"]').val();

            $.ajax({
                type: "post",
                url: _u("/bms/api/article/update"),
                data: {
                    "sn": sn,
                    "articleTitle": title,
                    "categorySn": categorySn,
                    "articleSummary": summary,
                    "articleContent": content
                },
                cache: false,
                dataType: 'json',
                success: function (res) {
                    if (Api.isOk(res)) {
                        layer.confirm('修改成功！赶快去看看吧', {
                            btn: ['去看看', '懒，不去'],
                            skin: 'layui-layer-lan',
                            anim: 4,
                            icon: 1
                        }, function (index) {
                            layer.close(index);
                            retArticleList();
                            window.open(__amsSiteUrl + '/' + sn);
                        }, function (index) {
                            layer.close(index);
                            retArticleList();
                        });
                    } else {
                        layer.alert(Api.msg(res, '修改失败'),
                                    {skin: 'layui-layer-lan', closeBtn: 0, icon: 2});
                    }
                }
            });
        });
    });

    function resetBlog() { /* no-op */ }

    function retArticleList() {
        // 优先方案：在当前 tab 容器内 reload 博客列表（保持 tab 不变）
        var $tab = $('#mod-article-form').closest('.tab-pane');
        if ($tab.length) {
            $tab.load(_u('/bms/article/list.do'));
            return;
        }

        // 兜底方案：未在 tab 容器中 → 触发左侧"博客列表"菜单 click，
        // 让 BMS 主框架（js-footer.html 里的 link-li handler）统一处理 tab 切换。
        // 这样不会走 window.location 整页跳转，从而避免 session 边界场景跳登录页。
        var $libLink = $('.link-li', window.parent ? window.parent.document : document)
            .filter(function () {
                return ($(this).attr('link-url') || '').indexOf('/bms/article/list.do') >= 0;
            });
        if ($libLink.length) {
            $libLink.trigger('click');
            return;
        }

        // 极端兜底：左侧菜单都找不到（如直接在新窗口打开本页）才走整页跳转
        window.location.href = _u('/bms/article/list.do');
    }

    // ================================================================
    // editormd 「添加图片」按钮 → 从资源库选择 适配层
    // ----------------------------------------------------------------
    // 与 write_article.html 共用一套实现，详情见 write_article.html 同名注释。
    // 之所以不抽 .js 公共文件：本系统并无 bms 端的统一 js 入口，
    // 两个模板复用同份代码、便于阅读 + Thymeleaf 改造时本地可见。
    // ================================================================
    // ================================================================
    // editormd 「添加图片」按钮 → 从资源库选择 适配层
    // 详细注释见 write_article.html 同名函数。核心策略：
    //   - 全局 click 捕获：拦 .fa-picture-o 或 a[name="image"]
    //   - MutationObserver 兜底：监听 editormd dialog 被 append 即移除并补弹 picker
    //   - 通过 textContent 含 "添加图片" 二次确认是图片对话框
    // ================================================================
    var __currentEditor = null;
    function bindImageLibraryPicker(editor) {
        __currentEditor = editor;
        if (window._libPickerBound) return;
        window._libPickerBound = true;

        document.addEventListener('click', function (e) {
            var t = e.target;
            while (t && t !== document) {
                if (t.nodeType === 1 && t.classList && t.classList.contains('fa-picture-o')) {
                    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                    if (__currentEditor) openImagePicker(__currentEditor);
                    return false;
                }
                if (t.tagName === 'A' && t.getAttribute && t.getAttribute('name') === 'image') {
                    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                    if (__currentEditor) openImagePicker(__currentEditor);
                    return false;
                }
                t = t.parentNode;
            }
        }, true /* useCapture */);

        try {
            var lastIntercept = 0;
            var mo = new MutationObserver(function (records) {
                for (var i = 0; i < records.length; i++) {
                    var added = records[i].addedNodes;
                    for (var j = 0; j < added.length; j++) {
                        var n = added[j];
                        if (n.nodeType !== 1) continue;
                        var dlg = matchImageDialog(n);
                        if (!dlg) continue;
                        var now = Date.now();
                        if (now - lastIntercept < 500) {
                            removeDialogTree(dlg);
                            continue;
                        }
                        lastIntercept = now;
                        removeDialogTree(dlg);
                        if (__currentEditor) openImagePicker(__currentEditor);
                    }
                }
            });
            mo.observe(document.body, {childList: true, subtree: true});
        } catch (e) { /* ignore */ }
    }

    function matchImageDialog(n) {
        if (isImageDialog(n)) return n;
        if (n.querySelector) {
            var c = n.querySelector('.editormd-dialog-image, .editormd-dialog');
            if (c && isImageDialog(c)) return c;
            var all = n.querySelectorAll && n.querySelectorAll('div, span, h1, h2, h3, header');
            if (all) {
                for (var i = 0; i < all.length; i++) {
                    if ((all[i].textContent || '').indexOf('添加图片') >= 0) {
                        var p = all[i];
                        while (p && p !== document.body) {
                            if (p.className && /editormd-dialog|dialog|modal|popup/.test(p.className)) {
                                return p;
                            }
                            p = p.parentNode;
                        }
                        return all[i].closest ? (all[i].closest('div') || all[i]) : all[i];
                    }
                }
            }
        }
        return null;
    }
    function isImageDialog(el) {
        if (!el || el.nodeType !== 1 || !el.className) return false;
        var cls = String(el.className);
        if (/editormd-dialog-image/.test(cls)) return true;
        if (/editormd-dialog/.test(cls)) {
            var txt = el.textContent || '';
            if (txt.indexOf('添加图片') >= 0 || /add\s*image/i.test(txt)) return true;
        }
        return false;
    }
    function removeDialogTree(dlg) {
        if (!dlg) return;
        try {
            var masks = document.querySelectorAll('.editormd-mask, .editormd-dialog-mask');
            for (var i = 0; i < masks.length; i++) {
                if (masks[i].parentNode) masks[i].parentNode.removeChild(masks[i]);
            }
        } catch (e) { /* ignore */ }
        if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
    }

    function openImagePicker(editor) {
        var isMobile = window.innerWidth <= 600;
        var iw = Math.min(window.innerWidth - 40, 1100);
        var ih = Math.min(window.innerHeight - 40, 720);
        var areaW = isMobile ? '100%' : iw + 'px';
        var areaH = isMobile ? '100%' : ih + 'px';

        var pickerLayer = layer.open({
            type: 2,
            title: '从图片库选择',
            skin: 'layui-layer-lan',
            shadeClose: false,
            maxmin: !isMobile,
            area: [areaW, areaH],
            content: _u('/bms/image/picker.do')
        });

        window.__onImagePicked = function (item) {
            if (!item || !item.url) {
                layer.msg('选择失败', {icon: 2});
                return;
            }
            var alt = (item.name || '图片').replace(/\]/g, '\\]');
            var url = String(item.url).replace(/\)/g, '%29');
            var md = '![' + alt + '](' + url + ')\n';
            editor.insertValue(md);
            layer.close(pickerLayer);
            layer.msg('已插入图片', {icon: 1, time: 800});
        };
        window.__onImagePickerCancel = function () {
            layer.close(pickerLayer);
        };
        window.__onImagePickerGotoLibrary = function () {
            layer.close(pickerLayer);
            var $libLink = $('.link-li').filter(function () {
                return ($(this).attr('link-url') || '').indexOf('/bms/image/library.do') >= 0;
            });
            if ($libLink.length) {
                $libLink.trigger('click');
            } else {
                layer.msg('未找到图片库菜单，请联系管理员', {icon: 7});
            }
        };
    }
</script>
</body>
</html>
