<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="css-head">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="shortcut icon" th:href="@{/statics/images/favicon.ico}"/>
    <title>Zqh's Blog</title>

    <link rel="stylesheet" th:href="@{/statics/plugins/bootstrap/dist/css/bootstrap.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/jquery.gritter/css/jquery.gritter.css}"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.bootcss.com/font-awesome/4.6.0/css/font-awesome.min.css"/>

    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/jquery.nanoscroller/nanoscroller.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/jquery.easypiechart/jquery.easy-pie-chart.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/bootstrap.switch/bootstrap-switch.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/bootstrap.datetimepicker/css/bootstrap-datetimepicker.min.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/jquery.select2/select2.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/bootstrap.slider/css/slider.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/statics/plugins/jquery.datatables/bootstrap-adapter/css/datatables.css}"/>
    <link rel="stylesheet" th:href="@{/statics/css/style.css}"/>
    <!-- 站点定制样式：图片上传组件 / 图片库 / 缩略图等 -->
    <link rel="stylesheet" th:href="@{/statics/css/bms-extra.css(v=1.0)}"/>

    <style>
        /* 让 #cl-wrapper{height:100%;display:table} 与侧边栏等绝对/表格布局正常生效 */
        html, body { height: 100%; margin: 0; }
        /* style.css 把 body 设成 opacity:0（依赖主题 motion.js 才会淡入），
           本系统没用那套 JS，强制可见，并撤销 margin-left:-20px 的偏移 */
        body { opacity: 1 !important; margin-left: 0 !important; }
        #tab-title li {
            display: inline-block;
            vertical-align: middle;
            font-size: 13px;
            transition: all .2s;
            -webkit-transition: all .2s;
            position: relative;
            line-height: 40px;
            min-width: 65px;
            padding: 0 10px;
            text-align: center;
            cursor: pointer;
        }
        .active { background: #ffffff; }
        .fa-pencil, .fa-trash-o, .fa-cloud-upload { width: 13px; height: 13px; }
        .fa-pencil:hover, .fa-trash-o:hover, .fa-cloud-upload:hover {
            background: #000;
            text-decoration: none;
            cursor: pointer;
            filter: alpha(opacity=50);
            opacity: .5;
        }
        a { cursor: pointer; }
    </style>
</th:block>
</body>
</html>
