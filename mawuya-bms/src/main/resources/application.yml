server:
  port: 8890
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: mawuya-bms
  # Jackson 全局序列化时区，与 JDBC URL serverTimezone / 启动类 TimeZone.setDefault
  # 三处保持一致；这样 @ResponseBody 返回 Date 时也按 +08 序列化，不会再出现
  # "接口返回 UTC 时间字符串、页面 JS 显示比真实时间慢 8h"的链路。
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false&maxAllowedPacket=67108864
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 60
      validation-query: SELECT 'x'
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 180

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

mawuya:
  # AMS 前台站点根地址（含 scheme，无尾斜杠）。BMS 模板中所有跳前台的链接都从这里读，
  # 杜绝硬编码 http://localhost:8080。上线请通过环境变量 MAWUYA_AMS_SITE_URL 覆盖。
  ams:
    site-url: ${MAWUYA_AMS_SITE_URL:https://mawuya.niudeyapi.com}
  # ============================== 站点显示名（与 AMS 共享同一 key） ==============================
  # 整个项目所有页面 brand / title / 登录页 / footer / SEO meta 都从这里读，单一数据源。
  # AMS 端由 SeoProperties 消费，BMS 端由 BmsGlobalModelAttributes 通过 @Value 注入。
  # 上线请通过环境变量 MAWUYA_SEO_SITE_NAME 覆盖；保持 AMS 与 BMS 两份 yml 此值一致。
  seo:
    site-name: ${MAWUYA_SEO_SITE_NAME:码无涯}
  upload:
    dir: ${user.home}/mawuya/upload/
    url-prefix: /upload
  async:
    # bms 不启用前台异步入库线程
    enabled: false
  security:
    jwt:
      # 生产部署务必覆盖（≥32 字节随机字符串），可在配置中心或环境变量注入
      secret: dev-only-PLEASE-CHANGE-this-32-byte-secret-string-9527-okxx
      # 默认 8 小时（28800 秒）
      expires-seconds: 28800
  # ===========================================================================
  # 定时清理任务
  #   log-info：访客日志表清理，防止 log_info 无限增长拖垮 DB
  #     - enabled        是否启用，默认 true
  #     - cron           执行周期，默认每天凌晨 03:00（业务低峰）
  #     - retain-days    保留天数，默认 30（删除 req_time < now-30d 的数据）
  #     - batch-size     单批 DELETE 行数，默认 1000，避免长事务
  #     - max-batches    单次任务最多批次数，默认 200（一次最多删 20w 条，剩余下个周期继续）
  #     - batch-sleep-ms 批间睡眠毫秒，默认 200，给主从同步留缓冲
  #     - max-retry      单批失败重试次数，默认 2（共最多 3 次尝试）
  #     - retry-backoff-ms 重试退避基数毫秒，默认 1000；实际延迟 = base*2^attempt
  #     - alert-enabled  失败告警开关，默认 true，失败时打 ERROR + [ALERT] 关键字
  # ===========================================================================
  cleanup:
    log-info:
      enabled: true
      cron: "0 0 3 * * ?"
      retain-days: 30
      batch-size: 1000
      max-batches: 200
      batch-sleep-ms: 200
      max-retry: 2
      retry-backoff-ms: 1000
      alert-enabled: true
