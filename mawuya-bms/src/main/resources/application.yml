server:
  port: 8890
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: mawuya-bms
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 60
      validation-query: SELECT 'x'
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 180

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

mawuya:
  upload:
    dir: ${user.home}/mawuya/upload/
    url-prefix: /upload
  async:
    # bms 不启用前台异步入库线程
    enabled: false
  security:
    jwt:
      # 生产部署务必覆盖（≥32 字节随机字符串），可在配置中心或环境变量注入
      secret: dev-only-PLEASE-CHANGE-this-32-byte-secret-string-9527-okxx
      # 默认 8 小时（28800 秒）
      expires-seconds: 28800
