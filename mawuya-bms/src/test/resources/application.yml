# 端到端测试专用配置（使用与生产相同的数据库）
server:
  port: 0   # 测试随机端口
spring:
  application:
    name: mawuya-bms-test
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 5
      validation-query: SELECT 'x'
      test-while-idle: true

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

mawuya:
  upload:
    dir: ${java.io.tmpdir}/mawuya/upload/
    url-prefix: /upload
  async:
    enabled: false

logging:
  level:
    com.niudeyapi.mawuya: INFO
