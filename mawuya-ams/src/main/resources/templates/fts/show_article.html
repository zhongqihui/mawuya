<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" class="theme-next mist use-motion"
      th:attr="data-theme=${currentTheme}">
<head>
    <th:block th:replace="~{fts/common/seo-meta :: seo-meta}"></th:block>
    <th:block th:replace="~{fts/common/css-head :: css-head}"></th:block>
</head>
<body lang="zh-Hans">
<div class="container one-collumn sidebar-position-left page-post-detail">
    <div class="headband"></div>
    <th:block th:replace="~{fts/common/header :: header}"></th:block>

    <main id="main" class="main" role="main">
        <div class="main-inner">
            <div class="content-wrap">
                <div id="content" class="content">
                    <th:block th:replace="~{fts/common/breadcrumb :: breadcrumb}"></th:block>

                    <div id="posts" class="posts-expand">
                        <article class="post post-type-normal"
                                 itemscope itemtype="https://schema.org/BlogPosting">
                            <header class="post-header">
                                <h1 class="post-title" itemprop="headline" th:text="${article.articleTitle}"></h1>
                                <meta itemprop="mainEntityOfPage"
                                      th:attr="content=${seoProperties.siteUrl} + '/' + ${article.sn}"/>
                                <meta itemprop="author" th:attr="content=${seoProperties.author}"/>
                                <div class="post-meta">
                                    <span class="post-time">
                                        <span class="post-meta-item-icon"><i class="fa fa-calendar-o"></i></span>
                                        <span class="post-meta-item-text">发表于 </span>
                                        <time th:if="${article.insertTime != null and #strings.length(article.insertTime) gt 10}"
                                              itemprop="datePublished"
                                              th:attr="datetime=${#strings.substring(article.insertTime, 0, 10)}"
                                              th:text="${#strings.substring(article.insertTime, 0, 10)}"></time>
                                        <time th:if="${article.updateTime != null and #strings.length(article.updateTime) gt 10}"
                                              itemprop="dateModified"
                                              hidden
                                              th:attr="datetime=${#strings.substring(article.updateTime, 0, 10)}"></time>
                                    </span>

                                    <span class="post-category" th:if="${category != null}">&nbsp; | &nbsp;
                                        <span class="post-meta-item-icon"><i class="fa fa-folder-o"></i></span>
                                        <span class="post-meta-item-text">分类于</span>
                                        <span><a th:href="@{|/categories/${category.sn}|}"
                                                 rel="category"
                                                 th:title="|查看「${category.categoryName}」分类下所有文章|">
                                            <span th:text="${category.categoryName}" itemprop="articleSection"></span>
                                        </a></span>
                                    </span>

                                    <span class="post-category">&nbsp; | &nbsp;
                                        <a href="#comments" class="post-comments-link">
                                            <span class="post-meta-item-icon"><i class="fa fa-comments-o"></i></span>
                                            <span class="post-meta-num" th:text="${article.reviewNum}"></span>
                                            <span class="post-meta-item-text post-meta-unit"> 条评论</span>
                                        </a>
                                    </span>

                                    <span>&nbsp; | &nbsp;
                                        <span class="post-meta-item-icon"><i class="fa fa-eye"></i></span>
                                        <span class="post-meta-num" th:text="${article.readNum}"></span>
                                        <span class="post-meta-item-text post-meta-unit"> 阅读</span>
                                    </span>
                                </div>

                                <!-- 文章标签徽标 -->
                                <div class="article-tags" th:if="${tags != null and not #lists.isEmpty(tags)}">
                                    <a th:each="t : ${tags}" class="article-tag" rel="tag"
                                       th:href="@{|/tags/${t.sn}|}"
                                       th:title="|查看「${t.tagName}」标签下所有文章|"
                                       th:style="|background:${t.tagColor != null ? t.tagColor : '#999'};|"
                                       th:text="|# ${t.tagName}|"></a>
                                </div>
                            </header>

                            <section class="post-body" itemprop="articleBody">
                                <div id="articleContentDiv">
                                    <textarea style="display: none" th:text="${article.articleContent}"></textarea>
                                </div>
                            </section>

                            <div>
                                <div class="copyright-txt">
                                    <a href="#"><i class="fa fa-copyright"></i>著作权归作者所有</a>
                                </div>
                            </div>

                            <footer class="post-footer">
                                <div class="post-tags" th:if="${category != null}">
                                    <a th:href="@{|/categories/${category.sn}|}" rel="tag"
                                       th:title="|查看「${category.categoryName}」分类下所有文章|"
                                       th:text="|#${category.categoryName}|"></a>
                                </div>

                                <nav class="post-nav" aria-label="上一篇 / 下一篇">
                                    <div class="post-nav-next post-nav-item">
                                        <a th:if="${prev != null}"
                                           th:href="@{|/${prev.sn}|}"
                                           rel="prev"
                                           th:title="|上一篇：${prev.articleTitle}|">
                                            <i class="fa fa-chevron-left"></i>
                                            <span th:text="${prev.articleTitle}"></span>
                                        </a>
                                    </div>
                                    <div class="post-nav-prev post-nav-item">
                                        <a th:if="${next != null}"
                                           th:href="@{|/${next.sn}|}"
                                           rel="next"
                                           th:title="|下一篇：${next.articleTitle}|">
                                            <i class="fa fa-chevron-right"></i>
                                            <span th:text="${next.articleTitle}"></span>
                                        </a>
                                    </div>
                                </nav>
                            </footer>
                        </article>
                    </div>

                    <!-- 相关阅读：内链权重传递（同分类 / 共标签） -->
                    <aside class="related-posts" th:if="${related != null and not #lists.isEmpty(related)}"
                           aria-labelledby="related-heading">
                        <h3 id="related-heading"><i class="fa fa-link"></i> 相关阅读</h3>
                        <ul class="related-list">
                            <li th:each="r : ${related}">
                                <a th:href="@{|/${r.sn}|}"
                                   th:title="${r.articleTitle}"
                                   th:text="${r.articleTitle}"></a>
                            </li>
                        </ul>
                    </aside>

                    <!-- 评论模块 -->
                    <section class="comment-section" id="comments" aria-labelledby="comment-heading">
                        <h3 id="comment-heading">
                            <i class="fa fa-comments-o"></i>
                            评论 <span th:text="|(${reviews != null ? #lists.size(reviews) : 0})|"></span>
                        </h3>

                        <ul class="comment-list" th:if="${reviews != null and not #lists.isEmpty(reviews)}">
                            <li class="comment-item" th:each="r : ${reviews}"
                                itemscope itemtype="https://schema.org/Comment">
                                <div class="comment-head">
                                    <i class="fa fa-user-o"></i>
                                    <span class="author" th:text="${r.reviewName}" itemprop="author">name</span>
                                    <time class="date"
                                          th:if="${r.reviewDate != null and #strings.length(r.reviewDate) gt 10}"
                                          itemprop="dateCreated"
                                          th:attr="datetime=${#strings.substring(r.reviewDate, 0, 10)}"
                                          th:text="${#strings.substring(r.reviewDate, 0, 16)}"></time>
                                </div>
                                <div class="comment-body" itemprop="text" th:text="${r.reviewContent}">content</div>
                            </li>
                        </ul>
                        <div class="comment-empty" th:if="${reviews == null or #lists.isEmpty(reviews)}">
                            <i class="fa fa-comment-o"></i> 暂无评论，快来抢沙发！
                        </div>

                        <div class="comment-form-box">
                            <h4>留下你的足迹 ✍️</h4>
                            <!-- 评论审核提示：成功 / 错误两种态；成功提示一段时间后可手动关闭 -->
                            <div th:if="${commentTip != null}"
                                 class="comment-tip"
                                 role="status"
                                 th:classappend="${commentTipType == 'error' ? 'comment-tip-error' : 'comment-tip-success'}"
                                 th:text="${commentTip}">提示</div>
                            <!-- 给所有访客的常驻说明：评论审核机制 -->
                            <div class="comment-review-note">
                                <i class="fa fa-info-circle"></i>
                                所有评论需经管理员审核通过后才会在此展示，请耐心等待。
                            </div>
                            <form th:action="@{/comments/submit}" method="post" autocomplete="off">
                                <input type="hidden" name="articleSn" th:value="${article.sn}"/>
                                <div class="form-row">
                                    <label class="visually-hidden" for="commentName">昵称</label>
                                    <input type="text" id="commentName" name="name"
                                           placeholder="昵称（必填，最多 40 字符）"
                                           required maxlength="40"/>
                                </div>
                                <div class="form-row">
                                    <label class="visually-hidden" for="commentContent">评论内容</label>
                                    <textarea id="commentContent" name="content" rows="4" required maxlength="500"
                                              placeholder="说点什么吧... (最多 500 字)"></textarea>
                                </div>
                                <button type="submit" class="submit-btn">
                                    <i class="fa fa-paper-plane"></i> 发表评论
                                </button>
                            </form>
                        </div>
                    </section>
                </div>
            </div>

            <th:block th:replace="~{fts/common/sidebar :: sidebar}"></th:block>
        </div>
    </main>
</div>

<th:block th:replace="~{fts/common/footer :: footer}"></th:block>

<script type="text/javascript" th:src="@{/statics/plugins/editor.md/lib/marked.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/editor.md/lib/prettify.min.js}"></script>
<script type="text/javascript" th:src="@{/statics/plugins/editor.md/editormd.min.js}"></script>
<script type="text/javascript" th:inline="javascript">
    /*<![CDATA[*/
    'use strict';

    // 由 Thymeleaf 注入：当前文章标题，用于补 alt 兜底
    var __articleTitle = /*[[${article.articleTitle}]]*/ '';

    $(function () {
        editormd.markdownToHTML("articleContentDiv", {
            htmlDecode: "style,script,iframe",
            emoji:    true,
            taskList: true,
            tex:      true,
            codeFold: true
        });

        // ====== Markdown 渲染后处理：图片懒加载 + 动态 alt + WebP picture 包装 ======
        function enhanceImages() {
            var imgs = document.querySelectorAll('#articleContentDiv img');
            for (var i = 0; i < imgs.length; i++) {
                var img = imgs[i];
                // 1) loading=lazy + decoding=async：长文章重图场景显著降低 LCP / TBT
                if (!img.getAttribute('loading')) {
                    img.setAttribute('loading', 'lazy');
                }
                if (!img.getAttribute('decoding')) {
                    img.setAttribute('decoding', 'async');
                }
                // 2) 缺失 alt 时，用文章标题 + 序号兜底，保证可访问性 + 图片 SEO
                if (!img.getAttribute('alt') || img.getAttribute('alt').trim() === '') {
                    img.setAttribute('alt', __articleTitle + ' 配图 ' + (i + 1));
                }
                // 3) 没显式宽高时给个默认 (避免 CLS)
                if (!img.hasAttribute('width')) {
                    img.setAttribute('width', '800');
                }
                if (!img.hasAttribute('height')) {
                    img.setAttribute('height', 'auto');
                }
                // 4) WebP 适配：用 picture 包裹同名 .webp 源（命中即用，不命中走原图）
                if (!img.parentNode || img.parentNode.tagName === 'PICTURE') {
                    continue;
                }
                var src = img.getAttribute('src') || '';
                if (/\.(jpe?g|png)(\?|$)/i.test(src)) {
                    var webp    = src.replace(/\.(jpe?g|png)(\?|$)/i, '.webp$2');
                    var picture = document.createElement('picture');
                    var source  = document.createElement('source');
                    source.setAttribute('type', 'image/webp');
                    source.setAttribute('srcset', webp);
                    img.parentNode.insertBefore(picture, img);
                    picture.appendChild(source);
                    picture.appendChild(img);
                }
            }
        }

        // ====== 图片点击放大（轻量级 lightbox） ======
        // editormd 渲染是异步的，等渲染完成再绑定
        function bindLightbox() {
            $('#articleContentDiv img:not(.no-zoom)').off('click.lb').on('click.lb', function (e) {
                var src = $(this).attr('src');
                if (!src) {
                    return;
                }
                var $lb = $('<div class="image-lightbox" role="dialog" aria-label="图片预览">' +
                            '  <span class="lightbox-close" aria-label="关闭">&times;</span>' +
                            '  <img src="' + src + '" alt="" />' +
                            '</div>');
                $lb.on('click', function () {
                    $(this).remove();
                });
                $('body').append($lb);
                e.stopPropagation();
            });
        }

        // editormd 异步渲染：500ms 内大概率完成；保险起见做两次兜底
        setTimeout(function () { enhanceImages(); bindLightbox(); }, 600);
        setTimeout(function () { enhanceImages(); bindLightbox(); }, 1500);
    });
    /*]]>*/
</script>
</body>
</html>
