<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" class="theme-next mist use-motion">
<head>
    <th:block th:replace="~{fts/common/css-head :: css-head}"></th:block>
</head>
<body lang="zh-Hans">
<div class="container one-collumn sidebar-position-left page-home">
    <div class="headband"></div>
    <th:block th:replace="~{fts/common/header :: header}"></th:block>

    <main id="main" class="main">
        <div class="main-inner">
            <div class="content-wrap">
                <div id="content" class="content">
                    <section id="posts" class="posts-collapse">
                        <div class="collection-title">
                            <h2><span th:text="${category.categoryName}"></span><small> 分类</small></h2>
                        </div>

                        <article class="post post-type-normal" th:each="item : ${category.arts}">
                            <header class="post-header">
                                <h1 class="post-title">
                                    <a class="post-title-link" th:href="@{|/${item.sn}|}">
                                        <span th:text="${item.articleTitle}"></span>
                                    </a>
                                </h1>

                                <div class="post-meta">
                                    <span th:if="${item.insertTime != null and #strings.length(item.insertTime) gt 10}"
                                          th:text="${#strings.substring(item.insertTime, 5, 10)}"></span>
                                </div>
                            </header>
                        </article>
                    </section>
                </div>
            </div>

            <th:block th:replace="~{fts/common/sidebar :: sidebar}"></th:block>
        </div>
    </main>
</div>
<th:block th:replace="~{fts/common/footer :: footer}"></th:block>
</body>
</html>
