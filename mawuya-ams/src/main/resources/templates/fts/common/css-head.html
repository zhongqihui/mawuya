<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  通用 head fragment：仅声明编码 / viewport / 主题色 / 静态资源；
  TDK / Canonical / OG / JSON-LD 全部交由 fts/common/seo-meta 处理，避免重复。
-->
<th:block th:fragment="css-head">
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="Cache-Control" content="no-transform"/>
    <meta name="theme-color" content="#222"/>
    <meta name="referrer" content="no-referrer-when-downgrade"/>

    <link rel="shortcut icon" th:href="@{/statics/images/myfavicon.ico}"/>

    <!-- 关键 CSS 内联：减少首屏阻塞，提升 LCP（背景 + 字体 + 容器底色）
         背景色按 currentTheme 服务端注入，避免外部主题 CSS 加载完成前先闪白底，
         同时根治内联 background:#fff 与主题底色叠层冲突导致的滚动区露白问题。 -->
    <style th:inline="text">
        /* 主题底色（SSR 注入，default/未知 一律按白底兜底） */
        html{background:[(${currentTheme == 'tech-dark' ? '#0a0e1a' : (currentTheme == 'gradient-vivid' ? '#fef3ff' : (currentTheme == 'minimal-business' ? '#fafafa' : '#fff'))})];}
        /* min-height:100vh 保证短内容下 html/body 至少撑满视口，避免主题底色仅覆盖顶部 */
        html,body{margin:0;padding:0;min-height:100vh;color:#555;
            font:14px/1.6 "PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
            -webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;}
        body{background:transparent;}
        /* main5174.css 中 body{background:#fff} 会覆盖上面这条；
           对非 default 主题用 !important 锁死透明，让 html 主题底色透出来 */
        html[data-theme="tech-dark"] body,
        html[data-theme="gradient-vivid"] body,
        html[data-theme="minimal-business"] body{background:transparent !important;}
        img{max-width:100%;height:auto;}
        .post-thumb-fixed{aspect-ratio:16/9;object-fit:cover;width:100%;display:block;}
        .breadcrumb-nav{padding:8px 0;font-size:12px;color:#999;}
        .breadcrumb-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
        .breadcrumb-list a{color:#666;text-decoration:none;}
        .breadcrumb-list a:hover{color:#222;text-decoration:underline;}
        .breadcrumb-sep{color:#bbb;}
    </style>

    <!-- 字体 / 主样式：preload + 异步加载，关键路径只阻塞极小内联 CSS -->
    <link rel="stylesheet" type="text/css"
          th:href="@{/statics/plugins/vendors/font-awesome/css/font-awesome.min93e3.css(v=4.4.0)}"/>
    <!-- 自研基础样式 blog-base.css：取代旧 NexT main5174.css，容器/字体/布局/响应式全部 token 化 -->
    <link rel="stylesheet" th:href="@{/statics/css/blog-base.css(v=3.0)}"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/editor.md/css/editormd.css}"/>
    <link rel="stylesheet" th:href="@{/statics/plugins/editor.md/css/editormd.preview.min.css}"/>
    <!-- 站点定制样式：业务级响应式微调（lightbox/back-to-top/use-motion） -->
    <link rel="stylesheet" th:href="@{/statics/css/blog-extra.css(v=3.9)}"/>
    <!--
      一键换皮：始终加载 3 套备用主题 CSS（default 不出文件，原版即默认）。
      AMS 模板 <html data-theme="xxx"> 由 GlobalModelAttributes 注入，
      属性选择器命中对应皮肤。新增/切换主题只动 blog_info.theme_code 与此处。
    -->
    <link rel="stylesheet" th:href="@{/statics/css/themes/tech-dark.css(v=3.0)}"/>
    <link rel="stylesheet" th:href="@{/statics/css/themes/gradient-vivid.css(v=3.0)}"/>
    <link rel="stylesheet" th:href="@{/statics/css/themes/minimal-business.css(v=3.0)}"/>
</th:block>
</body>
</html>
