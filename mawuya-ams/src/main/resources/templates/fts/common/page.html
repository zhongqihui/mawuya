<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="page">
    <nav class="pagination" th:if="${page.pageSize > 1}">
        <a th:if="${page.curr != 1}" class="extend prev" title="上一页"
           th:href="|javascript:goURL('${page.curr - 1}')|"><i class="fa fa-angle-left"></i></a>

        <th:block th:each="line : ${page.pageLine}">
            <a th:if="${line != #strings.toString(page.curr)} and ${line != '...'}"
               class="page-number" th:href="|javascript:goURL('${line}')|"
               th:text="${line}"></a>
            <span th:if="${line == #strings.toString(page.curr)}"
                  class="page-number current"
                  th:href="|javascript:goURL('${line}')|"
                  th:text="${line}"></span>
            <span th:if="${line == '...'}" class="space">&hellip;</span>
        </th:block>

        <a th:if="${page.curr != page.pageSize}" class="extend next" title="下一页"
           th:href="|javascript:goURL('${page.curr + 1}')|"><i class="fa fa-angle-right"></i></a>
    </nav>

    <script type="text/javascript" th:src="@{/statics/plugins/jquery.js}"></script>
    <script type="text/javascript" th:inline="javascript">
        /*<![CDATA[*/
        'use strict';

        // 由 Thymeleaf 注入：分页 POST 的目标 URL（不含上下文）+ 应用上下文路径
        var __pageUrl = /*[[${page.url}]]*/ 'index';
        var __ctxPath = /*[[@{/}]]*/ '/';

        /**
         * 跳转到指定页码：动态生成隐藏 form 并 POST currNum 字段。
         * 使用 POST 而不是 GET 是为了避免分页参数污染浏览器历史/前进后退。
         *
         * @param curr 目标页码（字符串或数字）
         */
        function goURL(curr) {
            var $form = $('<form></form>')
                .attr('action', __ctxPath + __pageUrl)
                .attr('method', 'post')
                .attr('hidden', 'hidden');
            $('<input/>')
                .attr('type', 'hidden')
                .attr('name', 'currNum')
                .attr('value', curr)
                .appendTo($form);
            $form.appendTo('body').submit();
        }
        /*]]>*/
    </script>
</th:block>
</body>
</html>
