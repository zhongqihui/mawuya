<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" class="use-motion"
      th:attr="data-theme=${currentTheme}">
<head>
    <th:block th:replace="~{fts/common/seo-meta :: seo-meta}"></th:block>
    <th:block th:replace="~{fts/common/css-head :: css-head}"></th:block>
</head>
<body lang="zh-Hans">
<div class="container page-home">
    <div class="headband"></div>
    <th:block th:replace="~{fts/common/header :: header}"></th:block>

    <main id="main" class="main" role="main">
        <div class="main-inner">
            <div class="content-wrap">
                <div id="content" class="content">
                    <th:block th:replace="~{fts/common/breadcrumb :: breadcrumb}"></th:block>

                    <!-- H1：首页保留语义化主标题（视觉隐藏不影响 SEO） -->
                    <h1 class="visually-hidden" th:text="${seoProperties.siteName} + ' - 文章列表'">Blog</h1>

                    <section id="posts" class="posts-expand" aria-label="文章列表">
                        <article class="post post-type-normal" th:each="article,iter : ${page.lists}"
                                 itemscope itemtype="https://schema.org/BlogPosting">
                            <header class="post-header">
                                <h2 class="post-title">
                                    <a class="post-title-link"
                                       th:href="@{|/${article.sn}|}"
                                       th:title="${article.articleTitle}"
                                       th:text="${article.articleTitle}"
                                       itemprop="url"></a>
                                    <meta itemprop="headline" th:attr="content=${article.articleTitle}"/>
                                </h2>

                                <div class="post-meta">
                                    <span class="post-time">
                                        <span class="post-meta-item-icon"><i class="fa fa-calendar-o"></i></span>
                                        <span class="post-meta-item-text">发表于</span>
                                        <time th:if="${article.insertTime != null and #strings.length(article.insertTime) gt 10}"
                                              itemprop="datePublished"
                                              th:attr="datetime=${#strings.substring(article.insertTime, 0, 10)}"
                                              th:text="${#strings.substring(article.insertTime, 0, 10)}"></time>
                                    </span>

                                    <span class="post-category">&nbsp; | &nbsp;
                                        <span class="post-meta-item-icon"><i class="fa fa-folder-o"></i></span>
                                        <span class="post-meta-item-text">分类于</span>
                                        <span>
                                          <a th:href="@{|/categories/${article.categorySn}|}" rel="category">
                                              <span th:each="c : ${categoryList}">
                                                  <span th:if="${article.categorySn == c.sn}"
                                                        th:text="${c.categoryName}"
                                                        itemprop="articleSection"></span>
                                              </span>
                                          </a>
                                        </span>
                                    </span>

                                    <span class="post-category">&nbsp; | &nbsp;
                                        <span class="post-meta-item-icon"><i class="fa fa-comments-o"></i></span>
                                        <span class="post-meta-num" th:text="${article.reviewNum}"></span>
                                        <span class="post-meta-item-text post-meta-unit"> 评论</span>
                                    </span>

                                    <span>&nbsp; | &nbsp;
                                       <span class="post-meta-item-icon"><i class="fa fa-eye"></i></span>
                                       <span class="post-meta-num" th:text="${article.readNum}"></span>
                                       <span class="post-meta-item-text post-meta-unit"> 阅读</span>
                                    </span>
                                </div>
                            </header>

                            <div class="post-body" itemprop="description">
                                <p th:text="${article.articleSummary}"></p>
                                <!--
                                  首页文章卡片预览图：
                                  - aspect-ratio + object-fit:cover 固定盒子防 CLS
                                  - loading 策略：第 1/2 张 eager + fetchpriority=high（提升 LCP）；其余 lazy
                                  - decoding=async：图片解码不阻塞主线程
                                  - alt：动态拼"标题 封面图"作为可读 fallback
                                -->
                                <!--
                                  首页文章卡片封面图：
                                  - 不再包外层 <a>：用户主诉"点击封面图希望放大而非跳详情"
                                    用户进入详情的入口由「文章标题」/「阅读全文」按钮承担
                                  - blog-base.js 的 setupImageLightbox() 会自动给 .post-thumb-fixed
                                    （现在没有 a 包裹）绑定原生 lightbox（lightbox 已专门对其做白名单）
                                -->
                                <div class="post-thumb-wrap"
                                     th:if="${article.pictureUrl != null and !#strings.isEmpty(article.pictureUrl)}">
                                    <img class="post-thumb-fixed post-thumb-zoom"
                                         th:with="firstImg=${#strings.contains(article.pictureUrl, ';') ? #strings.substringBefore(article.pictureUrl, ';') : article.pictureUrl}"
                                         th:src="${firstImg}"
                                         th:alt="|${article.articleTitle} 封面图|"
                                         width="800" height="450"
                                         decoding="async"
                                         th:attr="loading=${iter.index lt 2 ? 'eager' : 'lazy'},
                                                  fetchpriority=${iter.index eq 0 ? 'high' : 'auto'}"
                                         itemprop="image"/>
                                </div>
                                <div class="post-more-link text-center">
                                    <a class="btn"
                                       th:href="@{|/${article.sn}|}"
                                       rel="bookmark"
                                       th:title="|继续阅读：${article.articleTitle}|">
                                        阅读全文 &raquo;
                                    </a>
                                </div>
                            </div>
                            <footer class="post-footer">
                                <div class="post-eof"></div>
                            </footer>
                        </article>
                    </section>

                    <th:block th:replace="~{fts/common/page :: page}"></th:block>
                </div>
            </div>

            <th:block th:replace="~{fts/common/sidebar :: sidebar}"></th:block>
        </div>
    </main>

    <th:block th:replace="~{fts/common/footer :: footer}"></th:block>
</div>
</body>
</html>
