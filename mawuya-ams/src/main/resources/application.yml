server:
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: mawuya-ams
  # Jackson 全局序列化时区，与 JDBC URL serverTimezone / 启动类 TimeZone.setDefault
  # 三处保持一致；这样 @ResponseBody 返回 Date 时也按 +08 序列化，不会再出现
  # "接口返回 UTC 时间字符串、页面 JS 显示比真实时间慢 8h"的链路。
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false&maxAllowedPacket=67108864
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 60
      validation-query: SELECT 'x'
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 180

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 上传文件目录及静态访问前缀
mawuya:
  upload:
    dir: ${user.home}/mawuya/upload/
    url-prefix: /upload
  async:
    # ams 启用日志/阅读数异步入库线程
    enabled: true
  # ============================== SEO 全站配置 ==============================
  # 上线必须改 site-url 为真实域名（含 scheme，无尾斜杠），否则 canonical / sitemap / og:url 会指向 localhost。
  # 优先通过环境变量 MAWUYA_AMS_SEO_SITE_URL 覆盖，本机开发不需要设置。
  # 预发 / 灰度环境务必把 robots-index 设为 false，避免不正式内容被搜索引擎收录。
  seo:
    site-url: ${MAWUYA_AMS_SEO_SITE_URL:https://mawuya.niudeyapi.com}
    # 站点显示名：整个项目（AMS + BMS）所有页面 brand / title / footer 的唯一数据源；
    # BMS application.yml 必须保持此值一致；上线通过环境变量 MAWUYA_SEO_SITE_NAME 覆盖。
    site-name: ${MAWUYA_SEO_SITE_NAME:码无涯}
    default-title: ${MAWUYA_SEO_SITE_NAME:码无涯} - 分享技术与生活
    default-description: 码无涯 - 一个分享 Java、Spring Boot、MySQL 等后端技术与生活随笔的小站。
    default-keywords: Java,Go,微服务,Spring,Mybatis,博客,技术分享
    default-og-image: /statics/images/avatars/avatar2.jpg
    author: Zhongqihui
    locale: zh_CN
    twitter-card: summary_large_image
    twitter-site: ""
    robots-index: true
    sitemap-max-urls: 5000
    # 页脚信息：版权 / 联系方式 / 备案号；上线前请按真实信息填写，留空项不会渲染
    start-year: 2022
    email: zhongqihui996@gmail.com
    github: https://github.com/zhongqihui
    #icp-number: "闽ICP备2022014622号"
    #icp-url: https://beian.miit.gov.cn/
    police-record-number: ""
    police-record-url: ""
