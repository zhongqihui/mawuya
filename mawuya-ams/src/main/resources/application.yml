server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: mawuya-ams
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 60
      validation-query: SELECT 'x'
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 180

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 上传文件目录及静态访问前缀
mawuya:
  upload:
    dir: ${user.home}/mawuya/upload/
    url-prefix: /upload
  async:
    # ams 启用日志/阅读数异步入库线程
    enabled: true
  # ============================== SEO 全站配置 ==============================
  # 上线必须改 site-url 为真实域名（含 scheme，无尾斜杠），否则 canonical / sitemap / og:url 会指向 localhost。
  # 预发 / 灰度环境务必把 robots-index 设为 false，避免不正式内容被搜索引擎收录。
  seo:
    site-url: http://localhost:8080
    site-name: Zqh's Blog
    default-title: Zqh's Blog - 分享技术与生活
    default-description: Mawuya Blog - 一个分享 Java、Spring Boot、MySQL 等后端技术与生活随笔的小站。
    default-keywords: Java,Spring Boot,MySQL,Mybatis,博客,技术分享
    default-og-image: /statics/images/avatars/avatar2.jpg
    author: Zhongqihui
    locale: zh_CN
    twitter-card: summary_large_image
    twitter-site: ""
    robots-index: true
    sitemap-max-urls: 5000
